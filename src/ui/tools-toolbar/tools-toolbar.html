<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hoverboard tools</title>
  <link rel="stylesheet" href="../styles/design-tokens.css">
  <link rel="stylesheet" href="tools-toolbar.css">
</head>
<body>
  <!-- [REQ-NON_WEB_TOOLS_TOOLBAR] [ARCH-NON_WEB_TOOLS_TOOLBAR] [IMPL-NON_WEB_TOOLS_TOOLBAR] Badge tools toolbar on non-web tabs -->
  <header class="tools-toolbar-header">
    <img src="../../../icons/hoverboard_32.png" alt="" width="24" height="24">
    <h1>Hoverboard</h1>
  </header>
  <!-- <p class="tools-toolbar-note">This tab is not a web page. Open a full-page tool:</p> -->
  <nav class="tools-toolbar-nav" aria-label="Full-page tools">
    <button type="button" id="btn-bookmarks-index" class="tools-toolbar-btn">Local Bookmarks Index</button>
    <button type="button" id="btn-browser-import" class="tools-toolbar-btn">Browser Bookmark Import</button>
    <button type="button" id="btn-options" class="tools-toolbar-btn">Options</button>
    <button type="button" id="btn-browser-bookmarks" class="tools-toolbar-btn">Browser Bookmarks</button>
    <button type="button" id="btn-visit-history" class="tools-toolbar-btn">Visit History</button>
  </nav>
  <script type="module" src="tools-toolbar.js"></script>
</body>
</html>
