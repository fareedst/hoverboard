    details:
      - "getAllBookmarksForIndex aggregates local+file+sync+browser with storage field"
      - "getBookmarkForUrl: 2C race pinboard/local/file/sync only; consult browser via resolve or when no other non-empty candidate"
      - "moveBookmarkToStorage: get bookmark from current backend, save to target, delete from source, update index; targetBackend may be browser"
      - "Resolve provider: (valid data.preferredBackend) || getBackendForUrl(url) || defaultStorageMode; map to one of five providers (pinboard, local, file, sync, browser)"
    summary: "BookmarkRouter in src/features/storage/bookmark-router.js; holds pinboardProvider, localProvider, fileProvider, syncProvider, browserProvider, storageIndex, defaultStorageMode."
