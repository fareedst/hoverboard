      author: "AI Agent"
      date: "2026-02-14"
    last_updated:
      author: "AI Agent"
      date: "2026-07-29"
      reason: "Align index row with detail/sidecar for browser fifth provider and 2C"
  name: "Bookmark Router"
  rationale:
    benefits:
      - "deleteBookmark accepts url string or { url, preferredBackend }; Index Delete passes preferredBackend from Storage column (REQ-LOCAL_BOOKMARKS_INDEX)"
      - "getAllBookmarksForIndex aggregates local + file + sync + browser with storage field"
      - "getBookmarkForUrl, saveBookmark, deleteBookmark, saveTag, deleteTag delegate by URL; 2C excludes browser from best-of race (REQ-BROWSER_BOOKMARK_STORAGE)"
      - "getRecentBookmarks aggregates pinboard + local + file + sync + browser, sorted by time"
      - "getStorageBackendForUrl(url), moveBookmarkToStorage(url, targetBackend) for move UI including browser"
      - "saveBookmark honors data.preferredBackend (popup UI selection) so save follows the highlight (REQ-STORAGE_MODE_DEFAULT, REQ-MOVE_BOOKMARK_STORAGE_UI)"
