  implementation_approach:
    details:
      - Failure behavior: "Unsupported backend, rejected message, malformed payload, empty screenshot result, or missing identity logs diagnostics and applies all-false state without blocking ordinary bookmark UI."
      - Orchestration: "PopupController clears status on URL/backend changes, queries GET_PAGE_ARCHIVE and GET_PAGE_SCREENSHOTS with the selected backend after context resolution, and refreshes the relevant leg after successful capture."
      - Scoped UI state: "UIManager resolves status elements through the existing popup document or data-popup-ref container and updates active/data attributes, accessible labels, Reader disabled state, and independent capture controls."
      - Status normalizer: "normalizeArchiveArtifactStatus accepts archive and screenshot responses plus backend; only local/file and persisted artifact identities can produce positive state; stale archive remains readable."
    summary: "Add a pure archive-status module for response normalization, extend UIManager with scoped artifact status state, and let PopupController own context reset, selected-backend querying, initial resolution, and post-capture refresh."
