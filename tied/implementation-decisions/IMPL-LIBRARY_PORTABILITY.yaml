      - "Deterministic manifest and checksums."
      - "Explicit conflict and security outcomes."
      - "Verified and recoverable restore."
    problems_solved:
      - "Lossy or secret-bearing library export."
      - "Mutation before package validation and inability to recover interrupted restore."
    why: "Keep package serialization, validation, planning, and restore compensation in testable modules before adding UI or native/file bindings."
