  implementation_approach:
    details:
      - "BUILD_PACKAGE_MANIFEST returns a { manifest, artifacts } package so validation and restore operate on the same checksummed artifact map."
      - "Existing CSV/HTML/config import/export paths remain separate projections."
      - "Machine-specific File storage paths require an explicit target path map."
      - "Metadata and binary artifacts are separate manifest entries with safe relative paths."
      - "Restore verifies checksums and rebuilds derived archive-content search state from durable artifacts."
      - "Secret configuration is excluded by an allowlist and reported, never silently copied."
    summary: "Collect allowlisted library state and artifacts, build a deterministic checksummed package, validate it, plan restore without mutation, then execute with backup and compensation."
  metadata:
    last_updated:
      author: "AI Agent"
      date: "2026-08-02"
