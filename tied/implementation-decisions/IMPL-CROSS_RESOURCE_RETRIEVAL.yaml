  implementation_approach:
    details:
      - "Archive adapters return snippets and Reader targets, never sanitized HTML."
      - "Exact source identity is part of deduplication; Local and File archive identities never collapse."
      - "History adapter returns local usage records only; no remote analytics."
      - "Message handler exposes SEARCH_LIBRARY_RESOURCES while SEARCH_TITLE remains a compatibility path until explicitly retired."
      - "Query model caps limit at 100 and uses offset pagination with stable tie-breaking."
      - "VALIDATE_RETRIEVAL_SCOPES checks the canonical source registry before bounded reads; permission-denied sources remain selected so READ_RETRIEVAL_SOURCE reports isolated source state."
    summary: "Normalize and validate query, adapt each read-only source, fan out with a bounded concurrency limit, merge/dedupe/rank deterministically, and map source-specific actions."
  metadata:
    last_updated:
