      date: "2026-08-02"
      reason: "Align scope validation and adapter permission outcomes with source and test contracts"
  name: "Cross-Resource Retrieval Implementation"
  rationale:
    benefits:
      - "Deterministic bounded results."
      - "Isolated source failures and explicit availability states."
      - "Thin message/UI entry points."
    problems_solved:
      - "Non-deterministic or privacy-expanding aggregate search."
      - "Source-specific navigation and backend identity loss."
    why: "Keep the cross-resource contract in pure query, adapter, and orchestration modules so each boundary is independently testable."
