      - "IMPL-POPUP_THEME_CSS"
      - "REQ-LOCAL_BOOKMARKS_INDEX"
    supersedes: []
  status: "Active"
  test_coverage_note: "Unit tests validate placeholder shape, stable timestamp behavior, and seed preservation; composition tests validate theme/screenshot bindings and standalone page entry wiring; extension E2E validates current standalone and side-panel boundaries; rendered PNG generation remains visual E2E-only because it requires real Chromium, native bookmark APIs, and full-page artifacts."
  traceability:
    architecture: []
    code_annotations:
