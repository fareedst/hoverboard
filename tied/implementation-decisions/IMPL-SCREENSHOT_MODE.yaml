    - "REQ-RECENT_TAGS_SYSTEM"
    - "REQ-SUGGESTED_TAGS_FROM_CONTENT"
  essence_pseudocode_path: "implementation-decisions/IMPL-SCREENSHOT_MODE-pseudocode.md"
  implementation_approach:
    details:
      - "BUILD_STABLE_USAGE_FIXTURES uses a fixed seed timestamp when fixture data is absent, removing Date.now() drift from generated media"
      - "CAPTURE_SIDE_PANEL_SURFACES captures This Page, By Tag, and Tabs at 360x800"
      - "CAPTURE_STANDALONE_TOOL captures browser-bookmarks.html and visit-history.html at 1200x900; neither is represented as a side-panel tab"
      - "LOAD_SCREENSHOT_SEED preserves caller-provided usage and navigation-edge fixtures and derives a storage index when omitted"
      - "SEED_EXTENSION_DATA awaits local and sync storage writes before any capture surface opens"
    summary: "Generate README media from a temporary Chromium profile seeded with stable Hoverboard records, usage data, navigation edges, and native Chrome bookmarks; capture only the three current side-panel tabs, Local Bookmarks Index, Browser Bookmarks page, and Visit History page."
  metadata:
    created:
      author: "AI Agent"
      date: "2026-02-19"
    last_updated:
      author: "AI Agent"
      date: "2026-08-04"
      reason: "Separate stable seed construction, current surface capture, standalone tools, and theme validation"
  name: "Screenshot/Demo mode for placeholder screenshots"
  rationale:
    benefits:
      - "Repeatable screenshot script; no live bookmarks; deterministic placeholder data; optional seed from file"
    problems_solved:
      - "Manual screenshot capture is brittle and uses live user data"
      - "Popup opened as a tab in Playwright has that tab as \"active\", so bookmark data would be for the wrong URL"
      - "Storage seed was not awaited, so popup could load before data was written"
      - No store checkbox checked on index page, so seeded bookmarks were filtered out (REQ-LOCAL_BOOKMARKS_INDEX: "Stores default unchecked)"
    why: "Enable automated generation of README/docs screenshots with placeholder bookmark data"
  related_decisions:
    composed_with:
      - "IMPL-LOCAL_BOOKMARK_SERVICE"
      - "IMPL-POPUP_THEME_CSS"
    depends_on: []
    see_also:
