      - path: "scripts/screenshots-placeholder.js"
        description: "README media capture orchestration for current side-panel tabs, Local Bookmarks Index, and standalone tools"
      - path: "scripts/record-demo-side-panel-this-page.js"
        description: "This Page side-panel demo seed and visual capture"
      - path: "scripts/record-demo-side-panel-bookmarks.js"
        description: "Standalone Browser Bookmarks demo seed and visual capture"
      - path: "scripts/record-demo-side-panel-usage.js"
        description: "Standalone Visit History demo seed and visual capture"
      - path: "src/ui/popup/PopupController.js"
        description: "Screenshot mode URL parameters and ready marker for This Page capture"
      - path: "src/core/message-handler.js"
        description: "Screenshot-mode current bookmark resolution from data.url"
    functions: []
  cross_references:
    - "IMPL-LOCAL_BOOKMARK_SERVICE"
    - "IMPL-UI_TESTABILITY_HOOKS"
