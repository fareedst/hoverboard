      - "REQ-SIDE_PANEL_TAGS_TREE"
      - "REQ-SUGGESTED_TAGS_FROM_CONTENT"
    test_coverage_note: "Unit and composition suites cover pure seed and UI-free bindings; E2E covers page boundaries; media scripts provide visual evidence only for real-Chromium rendering and generated PNG outputs."
    tests:
      - "tests/integration/popup-theme-css-x-screenshot-mode-binding-composition.integration.test.js"
      - "tests/integration/standalone-tool-pages-composition.integration.test.js"
      - "tests/integration/tools-toolbar-launchers-composition.integration.test.js"
      - "tests/playwright/extension-demo-tabs.spec.js"
