  implementation_approach:
    details:
      - "Local/File/Sync create: time = data.time || now; updated_at = data.updated_at || time"
      - "Local/File/Sync update: keep existing time; updated_at = now"
      - "Normalize/display/move/export/import: always include updated_at; if missing (legacy) use updated_at = time"
      - "Pinboard: API returns only time; set updated_at = time in parseBookmarkResponse/createEmptyBookmark; never send updated_at to API"
    summary: "Local/File/Sync saveBookmark: on create use non-empty data.time/data.updated_at when provided (import/restore), else now; on update keep existing time and set updated_at = now. Pinboard: updated_at = time; never send updated_at to API. Normalize/export/import always include updated_at (legacy missing -> time)."
