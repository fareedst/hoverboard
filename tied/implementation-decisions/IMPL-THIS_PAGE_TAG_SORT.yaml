    - IMPL-UIManager_SCOPED_ROOT
    - IMPL-SUGGESTED_TAGS
    - IMPL-PLAYWRIGHT_E2E_EXTENSION
  decision: 'Side panel: three-way chip ordering (alphabetical, bookmark frequency, DOM relevance) when tagSortToggle is present; popup preserves controller order. PopupController loads hoverboard_tag_frequency and runs two-step MAIN-world inject (snippet file then extractor) for suggested rows; UIManager merges frequency map without auto-redraw and sorts via tag-chip-sort.sortTagChipRows.'
  rationale:
    why: Users need one shared sort mode across Current, Recent, and Suggested chips without changing membership.
    problems_solved:
      - Single-heuristic ordering insufficient
      - Suggested tags need relevance-aware ordering
    benefits:
      - Pure sort module shared by all chip lists
      - Frequency from storage; relevance from page extract
  implementation_approach:
    details:
      - 'cacheElements: sort UI enabled when elements.tagSortToggle resolved under scoped container'
      - setTagFrequencyMapForSort merges map; caller redraws
      - updateCurrentTags / updateRecentTags / _paintSuggestedTags build rows and sort when getEffectiveTagSortMode() non-null
      - 'PopupController._normalizeHoverboardTagFrequencyMap: coerce storage payload to plain object for setTagFrequencyMapForSort'
      - 'Composition: loadInitialData awaits refreshTagFrequencyMapForSort before updateCurrentTags; awaits loadRecentTags before loadSuggestedTags'
      - 'Composition: setupEventListeners wires [data-sort-mode] clicks to setTagSortMode'
      - PopupController._normalizeSuggestedRowsFromMainWorld implements trim + invalid-row drop before FILTER_NOT_ON_CURRENT_BOOKMARK
  code_locations:
