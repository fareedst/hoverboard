IMPL-THIS_PAGE_TAG_SORT:
  summary: "UIManager: tagSortToggle wiring, tagFrequencyMap, sort applied in updateCurrentTags, updateRecentTags, _paintSuggestedTags when toggle present. PopupController: refreshTagFrequencyMapForSort; loadSuggestedTags uses two-step MAIN inject (suggested-tags-main-world-snippet.js + func). Shared tag-chip-sort.js."
  essence_pseudocode: "# [IMPL-THIS_PAGE_TAG_SORT] [ARCH-THIS_PAGE_TAG_SORT] [REQ-THIS_PAGE_TAG_SORT]\n# Summary: Side panel three-way chip sort (alphabetical | bookmark frequency | DOM relevance) when tagSortToggle exists; popup keeps controller order; uses tag-chip-sort.sortTagChipRows.\n# Composition / cross-IMPL: [IMPL-UIManager_SCOPED_ROOT] + [ARCH-SIDE_PANEL_TABS] + [REQ-SIDE_PANEL_POPUP_EQUIVALENT] — scoped cacheElements must resolve tagSortToggle before sort UI applies. [IMPL-SUGGESTED_TAGS] + [ARCH-SUGGESTED_TAGS] + [REQ-SUGGESTED_TAGS_FROM_CONTENT] — MAIN-world snippet registers extractor; this IMPL owns inject order (file then func), normalization, filter vs bookmark, empty-on-error. Shared data: tagFrequencyMap (storage); suggested cache as { tag, relevance, inPageFrequency } post-normalize. Pre: snippet inject may fail non-fatally; post: UIManager.updateSuggestedTags always receives array (possibly empty).\n#\n# How — Contract shape: DATA tagFrequencyMap from hoverboard_tag_frequency; UIManager INPUT optional container + chip lists; OUTPUT sorted chips when getEffectiveTagSortMode() non-null else source order; PopupController OUTPUT frequency map + normalized suggested rows.\n\n# How — refreshTagFrequencyMapForSort: AWAIT get hoverboard_tag_frequency; map = _normalizeHoverboardTagFrequencyMap(raw) (plain object tag→count only, else {}); setTagFrequencyMapForSort(map); silent if storage missing; CATCH debugError only.\nrefreshTagFrequencyMapForSort():\n  IF NOT chrome.storage.local THEN RETURN\n  TRY: AWAIT get hoverboard_tag_frequency; map = _normalizeHoverboardTagFrequencyMap(raw); uiManager.setTagFrequencyMapForSort(map)\n  CATCH: debugError; RETURN\n\n# [IMPL-THIS_PAGE_TAG_SORT] [ARCH-THIS_PAGE_TAG_SORT] [REQ-THIS_PAGE_TAG_SORT]\n# How — loadInitialData composition binding: after normalizedTags for This Page, AWAIT refreshTagFrequencyMapForSort() then uiManager.updateCurrentTags(normalizedTags) so frequency mode has map on first paint. Composition test: tests/integration/this-page-tag-sort-composition.integration.test.js.\n\n# [IMPL-THIS_PAGE_TAG_SORT] [ARCH-THIS_PAGE_TAG_SORT] [REQ-THIS_PAGE_TAG_SORT]\n# How — setupEventListeners composition: delegated click on [data-sort-mode] under tagSortToggle; if isTagChipSortMode(m) then setTagSortMode(m) (updates segment aria-pressed, redrawTagChipsFromCache). Composition test: tests/integration/this-page-tag-sort-composition.integration.test.js.\n\n# How — setTagFrequencyMapForSort: merge map into tagFrequencyMap; no auto-redraw.\n\n# [IMPL-THIS_PAGE_TAG_SORT] [IMPL-UIManager_SCOPED_ROOT] [ARCH-THIS_PAGE_TAG_SORT] [ARCH-SIDE_PANEL_TABS] [REQ-THIS_PAGE_TAG_SORT] [REQ-SIDE_PANEL_POPUP_EQUIVALENT]\n# How — After scoped element resolution (querySelector under container per IMPL-UIManager_SCOPED_ROOT), enable sort UI when elements.tagSortToggle is non-null.\n\n# How — getEffectiveTagSortMode: return null if no toggle UI; else alphabetical | frequency | relevance from segment state.\n\n# How — updateCurrentTags / updateRecentTags / _paintSuggestedTags: if mode null render source order; else build rows (canonical, displayKey=tagChipDisplayAndAddValue, stableIndex, bookmarkFreq=lookupBookmarkFrequency, suggested adds relevance/inPageFrequency) then sortTagChipRows then paint.\n\n# [IMPL-THIS_PAGE_TAG_SORT] [IMPL-SUGGESTED_TAGS] [ARCH-THIS_PAGE_TAG_SORT] [ARCH-SUGGESTED_TAGS] [REQ-THIS_PAGE_TAG_SORT] [REQ-SUGGESTED_TAGS_FROM_CONTENT]\n# How — loadSuggestedTags: ordering MUST be executeScript MAIN files (snippet) then executeScript MAIN func -> __hoverboardExtractSuggestedTagsWithRelevance (IMPL-SUGGESTED_TAGS registers global in snippet). Normalize to rows; filter CI against current bookmark tags; on any script failure updateSuggestedTags([]). Full tier rules live in snippet file, not duplicated here.\nloadSuggestedTags():\n  IF no tab id OR url not http(s) THEN updateSuggestedTags([]); RETURN\n  TRY\n    TRY executeScript MAIN files [suggested-tags-main-world-snippet.js] ON fileErr log non-fatal CONTINUE\n    AWAIT executeScript MAIN func -> globalThis.__hoverboardExtractSuggestedTagsWithRelevance()\n    NORMALIZE raw array to rows; FILTER invalid; FILTER out tags on current bookmark (CI)\n    updateSuggestedTags(list)\n  CATCH scriptError: debugError; updateSuggestedTags([])\n\n# How — Alphabetical comparator: localeCompare displayKey lower; tie stableIndex.\n# How — Frequency comparator: bookmarkFreq desc; tie displayKey CI; tie stableIndex.\n# How — Relevance comparator: relevance desc; tie bookmarkFreq; tie inPageFrequency; tie displayKey CI; tie stableIndex.\n\n# [IMPL-THIS_PAGE_TAG_SORT] [ARCH-THIS_PAGE_TAG_SORT] [REQ-THIS_PAGE_TAG_SORT]\n# E2E-only boundary — testability: e2e_only. Chromium MV3 chrome-extension:// side panel document: production esbuild bundle (side-panel.js/css) and extension security origin; Chromium side-panel host layout, pointer targeting, and in-page chrome.runtime are not reproducible in JSDOM/Node composition tests. Composition tests cover setupEventListeners/setTagSortMode logic; Playwright spec: tests/playwright/extension-this-page-tag-sort.spec.js asserts real panel toolbar visibility and aria-pressed after click.\nside_panel_tag_sort_toolbar_e2e():\n  PRE: open chrome-extension://…/side-panel.html; bookmarkPanel mainInterface visible\n  ASSERT [data-popup-ref=\"tagSortToggle\"] visible with production CSS\n  ON user click [data-sort-mode=\"frequency\"]: aria-pressed reflects active segment (bundled UIManager)\n"
