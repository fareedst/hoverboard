      - path: src/ui/popup/PopupController.js
        description: refreshTagFrequencyMapForSort; loadSuggestedTags (MAIN inject + _normalizeSuggestedRowsFromMainWorld + dedupe); loadInitialData orchestration
      - path: src/features/tagging/suggested-tags-main-world-snippet.js
        description: MAIN-world relevance tiers and extractor global
      - path: src/ui/side-panel/side-panel.html
        description: tagSortToggle markup
      - path: src/ui/side-panel/side-panel.css
        description: sort toggle styling
    functions:
      - name: sortTagChipRows
        file: src/shared/tag-chip-sort.js
        description: Three-mode comparator dispatch
      - name: refreshTagFrequencyMapForSort
        file: src/ui/popup/PopupController.js
        description: Storage read hoverboard_tag_frequency; normalize map then setTagFrequencyMapForSort
      - name: _normalizeHoverboardTagFrequencyMap
        file: src/ui/popup/PopupController.js
        description: Coerce stored hoverboard_tag_frequency to plain object or {}
      - name: _normalizeSuggestedRowsFromMainWorld
        file: src/ui/popup/PopupController.js
        description: 'NORMALIZE_SUGGESTED_ROWS + FILTER_INVALID_ROWS: trim tags; drop empty-after-trim'
      - name: loadSuggestedTags
        file: src/ui/popup/PopupController.js
        description: MAIN inject + _normalizeSuggestedRowsFromMainWorld + bookmark dedupe → updateSuggestedTags
      - name: updateCurrentTags / updateRecentTags / _paintSuggestedTags
        file: src/ui/popup/UIManager.js
        description: Optional sort before paint
