    testability: e2e_only
    e2e_only_reason: Chromium MV3 chrome-extension:// side panel page loads the production side-panel bundle in the extension origin; JSDOM composition tests cannot load unpacked extension HTML, reproduce the Chromium side-panel host (layout, hit targets, focus), or exercise chrome.runtime in that document. Binding logic remains covered by tests/integration/this-page-tag-sort-composition.integration.test.js.
    playwright_spec: tests/playwright/extension-this-page-tag-sort.spec.js
  cross_references:
    - ARCH-THIS_PAGE_TAG_SORT
