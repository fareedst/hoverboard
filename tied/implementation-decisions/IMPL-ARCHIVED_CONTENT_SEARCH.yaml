  implementation_approach:
    details:
      - "Archive browse/search scope rebuilds from persisted archives and maps results to extension-resolvable Reader targets before table rendering."
      - "Archive lifecycle synchronization removes only the selected backend entry when backend is supplied and removes all URL entries only for legacy backend-omitted cleanup."
      - "Capture/recapture calls replace; deletion calls remove; missing archives do not appear as successful content matches."
      - "Derived archive search entries are keyed by backend plus normalized URL so Local and File records sharing a URL remain distinct."
      - "Index entries are keyed by backend plus normalized URL and contain extracted text plus archive metadata, not sanitized HTML."
      - "Local Query API aggregate snapshots remain metadata-only in this phase."
      - "Metadata search remains the default and existing matchSearch behavior is unchanged."
      - "Query normalization is case-insensitive substring matching with bounded context snippets; result ordering is deterministic by match position, capture time, storage, then URL."
      - "Search and browse results include storage and archiveId and construct Reader targets with the selected archive identity."
    summary: "Add an archive text index/query module and compose it with the Local Bookmarks Index through an explicit content scope."
  metadata:
    created:
