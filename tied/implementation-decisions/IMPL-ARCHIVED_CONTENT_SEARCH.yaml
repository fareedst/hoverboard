      - "Incremental replace/remove synchronization with archive storage."
    problems_solved:
      - "Archive lifecycle can otherwise leave stale search results."
      - "No query path exists for extracted archive text."
    why: "A small deterministic module can provide testable archive search without changing existing metadata filtering or exposing archive bodies through the Local Query API."
