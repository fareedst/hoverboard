  implementation_approach:
    details:
      - "manifest side_panel.default_path → side-panel.html"
      - "On browser tab change (onActivated/onUpdated): if controller exists always call refreshPopupData() so currentPin is for new tab; then refresh By Tag tab when visible via refreshTagsTreeTabIfVisible (setSelectedTagsFromCurrentBookmark)"
      - "Recommended E2E (IMPL-SIDE_PANEL_TABS): after loading side panel, assert header row has left text matching Hoverboard v* and right text matching YYYY-MM-DD HH:mm."
      - "S08 testability: bindWindowFocusRecentTagsRefresh — full two-window recent-tags sync (REQ-RECENT_TAGS_SYSTEM) is e2e_only for end-to-end proof; e2e_only_reason: requires live Chromium extension host with chrome.sidePanel + chrome.windows.onFocusChanged across multiple browser windows and real SW messaging; unit/integration cover guards and loadRecentTags via mocks (tests/unit/side-panel-tabs.test.js)."
      - "S10 Phase G: tests/integration/browser-tabs-tab-composition.integration.test.js exercises runInitialTabInit(TAB_BROWSER_TABS) and switchTabForTest(TAB_BROWSER_TABS) → initBrowserTabsTab (mocked); resetBrowserTabsTabInitedForTest clears one-shot guard."
      - "S10 Phase G: tests/integration/window-focus-recent-tags-composition.integration.test.js exercises bindWindowFocusRecentTagsRefresh wiring (onFocusChanged → getCurrent → shouldInvokeLoadRecentTagsOnWindowFocusSync → loadRecentTags) without UI; setActiveTabForTest drives activeTab for guard branches."
      - "S12 REQ-MODULE_VALIDATION: (1) side-panel-tab-state.js pure predicate shouldInvokeLoadRecentTagsOnWindowFocusSync — unit tests in tests/unit/side-panel-tabs.test.js; (2) side-panel.js bindWindowFocusRecentTagsRefresh wiring — composition tests in tests/integration/window-focus-recent-tags-composition.integration.test.js; (3) browser Tabs tab init binding — tests/integration/browser-tabs-tab-composition.integration.test.js; (4) This Page Recent Tags mount in extension document — Playwright tests/playwright/extension-side-panel-recent-tags-e2e.spec.js; cross-window focus refresh remains e2e_only per phase_h_window_focus_recent_tags_cross_window."
      - "Side panel header: single line with left \"Hoverboard v{version}\" (or \"Hoverboard\" if no version) and right build time UTC (YYYY-MM-DD HH:mm); elements #side-panel-title-version (left) and #side-panel-version (right); flex row, space-between."
      - "Storage key e.g. hoverboard_sidepanel_active_tab; values \"bookmark\" | \"tagsTree\" | \"browserTabs\""
      - "Tab buttons: data-tab=\"bookmark\", data-tab=\"tagsTree\", data-tab=\"browserTabs\"; click handler switches panel, saves to storage, runs init for that tab if not yet inited"
      - "This Page init runs once (guard); By Tag init can re-run on each show or once"
    summary: "side-panel.html: tab bar; panels #bookmarkPanel, #tagsTreePanel, #browserTabsPanel; persist hoverboard_sidepanel_active_tab; lazy init This Page / By Tag / Tabs; bindTabChangeRefresh and bindWindowFocusRecentTagsRefresh (REQ-RECENT_TAGS_SYSTEM) when Bookmark tab active; composed_with IMPL-SIDE_PANEL_BOOKMARK, IMPL-SIDE_PANEL_TAGS_TREE, IMPL-SIDE_PANEL_BROWSER_TABS."
