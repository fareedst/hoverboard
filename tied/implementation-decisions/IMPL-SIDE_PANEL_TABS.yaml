  phase_h_window_focus_recent_tags_cross_window:
    e2e_only_reason: "REQ-RECENT_TAGS_SYSTEM cross-window refresh depends on chrome.windows.onFocusChanged when focus moves between separate browser windows; the Playwright extension fixture uses one persistent Chromium window (extra pages are tabs, not OS-level multi-window focus parity). bindWindowFocusRecentTagsRefresh wiring and sync guards are covered by tests/integration/window-focus-recent-tags-composition.integration.test.js."
    testability: "e2e_only"
