      - name: "switchTab"
        description: "Show panel for tab, hide other; persist; init tab if needed"
        file: "src/ui/side-panel/side-panel.js"
      - name: "initBookmarkTab"
        description: "UISystem init, createPopup(container), loadInitialData, setupEventListeners"
        file: "src/ui/side-panel/side-panel.js"
      - name: "initTagsTreeTab"
        description: "Load bookmarks, config, render tag selector and tree"
        file: "src/ui/side-panel/tags-tree.js"
      - name: "bindTabChangeRefresh"
        description: "Register tabs.onActivated and tabs.onUpdated; always refresh controller when panel open; then refresh This Page UI (when visible) and By Tag (when visible via refreshTagsTreeTabIfVisible)"
        file: "src/ui/side-panel/side-panel.js"
      - name: "bindWindowFocusRecentTagsRefresh"
        description: "chrome.windows.onFocusChanged; exported for Phase G composition tests; when Bookmark tab active and controller ready after window-id match, controller.loadRecentTags()"
        file: "src/ui/side-panel/side-panel.js"
      - name: "setActiveTabForTest"
        description: "Test-only: set module activeTab for composition tests of bindWindowFocusRecentTagsRefresh guards"
        file: "src/ui/side-panel/side-panel.js"
      - name: "switchTabForTest"
        description: "Phase G: exported wrapper for switchTab(tabId) — drives initBrowserTabsTab binding without tab-bar click"
        file: "src/ui/side-panel/side-panel.js"
      - name: "resetBrowserTabsTabInitedForTest"
        description: "Test-only: clear browserTabsTabInited so composition tests can re-invoke initBrowserTabsTab path"
        file: "src/ui/side-panel/side-panel.js"
      - name: "refreshBookmarkTabIfVisible"
        description: "Call controller.refreshPopupData() when This Page tab is visible and inited"
        file: "src/ui/side-panel/side-panel.js"
      - name: "refreshTagsTreeTabIfVisible"
        description: "Call setSelectedTagsFromCurrentBookmark(controller tags) when By Tag tab is visible and inited (on browser tab change)"
        file: "src/ui/side-panel/side-panel.js"
      - name: "runInitialTabInit"
        description: "On panel load: when activeTab is tagsTree, await initBookmarkTab then init By Tag with getTagsTreeInitOptions(controller); else initTabIfNeeded(activeTab). Exported for tests."
        file: "src/ui/side-panel/side-panel.js"
      - name: "getTagsTreeInitOptions"
        description: "Pure helper: given controller, returns currentBookmarkTags for initTagsTreeTab (By Tag on open shows current URL record)."
        file: "src/ui/side-panel/side-panel-tab-state.js"
      - name: "shouldInvokeLoadRecentTagsOnWindowFocusSync"
        description: "Pure sync guards for bindWindowFocusRecentTagsRefresh before loadRecentTags; unit-tested in side-panel-tabs.test.js"
        file: "src/ui/side-panel/side-panel-tab-state.js"
      - name: "setSidePanelVersion"
        description: "Set #side-panel-title-version to \"Hoverboard v\" + version or \"Hoverboard\"; set #side-panel-version to buildTimeUtc. No-op when #side-panel-version missing. Exported for tests."
        file: "src/ui/side-panel/side-panel.js"
      - name: "initSidePanelVersion"
        description: "Called on DOMContentLoaded; reads getManifest().version and BUILD_TIME_UTC, calls setSidePanelVersion()."
        file: "src/ui/side-panel/side-panel.js"
