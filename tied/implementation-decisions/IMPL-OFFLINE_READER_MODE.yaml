  implementation_approach:
    details:
      - "After archive lookup, Reader requests only persisted product screenshots for the resolved URL and renders validated image data URLs; demo screenshot assets are never queried."
      - "APPLY_SOURCE_PRESENTATION sets only fixed extension-owned CSS variables on the Reader shell and clears them for the Hoverboard Reader theme fallback."
      - "Archive lookup response failures and rejected storage reads are rendered through the same structured Reader error state with stable failure codes."
      - "Existing archives without a profile use fallback colors without migration or recapture."
      - "Missing, stale, unsupported, and storage-error states render as accessible status panels."
      - "Missing, stale, unsupported, storage-error, and malformed responses render distinct accessible states; stale content remains readable."
      - "Only sanitizedHtml from the archive store is assigned to a constrained reader container; scripts, inline event handlers, and unsafe URLs are removed at capture time and blocked by page policy."
      - "Reader chrome and content inherit the active profile; status semantics remain extension-owned and archive HTML is never modified with profile values."
      - "Reader lookup and screenshot lookup pass the same selected backend and archive identity so duplicate Local/File URLs cannot cross-resolve."
      - "Reader navigation carries backend and archiveId when available; URL remains a fallback only for explicitly unambiguous legacy targets."
      - "Reader parses archive identifier or normalized URL from query parameters and requests archive data through a dedicated message."
      - "The live URL action is explicit and never part of archive loading."
      - "VALIDATE_SOURCE_PRESENTATION normalizes persisted profile fields and requires WCAG AA 4.5:1 contrast for text and optional link against an opaque background."
    summary: "Add a Reader tool page, safe HTML container, status renderer, and validated source presentation application for persisted archives."
