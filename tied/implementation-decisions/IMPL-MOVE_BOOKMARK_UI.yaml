  name: "Move Bookmark Storage UI"
  rationale:
    benefits:
      - "Save follows highlight for ordinary bookmark operations while Read Later Browser selection remains metadata-capable"
      - "Users see the effective backend and understand why Browser could not store Read Later metadata"
    problems_solved:
      - "Archive-status feedback must not be conflated with bookmark action feedback"
      - "New Read Later saves previously passed Browser as preferredBackend and lost toread metadata"
      - "Unbookmarked URLs were misclassified by a truthy currentPin stub"
    why: "Preserve ordinary Save to behavior while making new Read Later persistence reliable for metadata-capable backends."
