  essence_pseudocode_path: "implementation-decisions/IMPL-MOVE_BOOKMARK_UI-pseudocode.md"
  implementation_approach:
    details:
      - "Invoke the existing createBookmark path with toread=yes and the resolved preferredBackend; apply Save to fallback feedback only after successful persistence"
      - "No separate Local/File toggle control; Local↔File↔Browser moves use the same Save to buttons"
      - "On new Read Later save: distinguish persisted bookmark by currentPin.time, resolve Browser selection through ConfigManager.getStorageMode(), and use Local if the normalized mode is Browser"
      - "On ordinary save (createBookmark, addTagsToBookmark, handleTogglePrivate, persisted handleReadLater): add data.preferredBackend = getSelectedStorageBackend() so save follows highlight"
      - "On select change: send moveBookmarkToStorage(url, targetBackend); refresh bookmark data"
      - "Pinboard storage option disabled in popup when no API token (updateStoragePinboardEnabled from getAuthToken)"
      - "Popup and This Page share UIManager readLater event binding"
      - "PopupController: on load get storage backend for current URL (or default when no bookmark); set highlighted button"
    summary: "Popup Save to five select-one buttons; new Read Later saves resolve Browser selection to a metadata-capable backend and reflect the effective backend after success."
