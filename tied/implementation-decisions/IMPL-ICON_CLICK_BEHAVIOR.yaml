# [IMPL-ICON_CLICK_BEHAVIOR] [ARCH-ICON_CLICK_BEHAVIOR] [REQ-ICON_CLICK_BEHAVIOR]
# Implementation: Remove default_popup; SW action.onClicked; config iconClickOpensSidePanel; options toggle.
IMPL-ICON_CLICK_BEHAVIOR:
  code_locations:
    files:
      - path: "manifest.json"
        description: "remove default_popup"
      - path: "src/config/config-manager.js"
        description: "default and schema for iconClickOpensSidePanel"
      - path: "src/ui/options/options.html"
        description: "toggle UI"
      - path: "src/ui/options/options.js"
        description: "bind and load/save toggle"
      - path: "src/core/service-worker.js"
        description: "handleActionClick(tab) takes clicked tab from onClicked and prefers its windowId; synchronous sidePanel.open(useWindowId); cold start seeds cache and openPopup only; _openSidePanelWithFallback for commands/menu/OPEN_SIDE_PANEL"
      - path: "src/ui/side-panel/side-panel.js"
        description: "bindToggleCloseRequest, REQUEST_SIDE_PANEL_CLOSE listener and window.close"
      - path: "src/core/message-handler.js"
        description: "MESSAGE_TYPES.REQUEST_SIDE_PANEL_CLOSE"
  cross_references:
    - "ARCH-ICON_CLICK_BEHAVIOR"
    - "REQ-ICON_CLICK_BEHAVIOR"
  e2e_recommendations:
    - "Icon click cold-start: immediately after browser/extension load (before navigating), click extension icon and assert side panel opens (validates tabs.query callback when _sidePanelWindowId is null)."
    - "Icon click correct window: ensured by using the tab Chrome passes to action.onClicked; unit test covers handleActionClick(tab) with tab.windowId differing from cache. E2E cannot simulate toolbar click per-window; existing OPEN_SIDE_PANEL / cold-start E2E (extension-icon-click.spec.js) remains the recommended coverage."
    - "Icon click opens side panel: with extension loaded, simulate toolbar icon click (e.g. CDP or chrome.action API from test context) and assert side panel becomes visible or side-panel page is focused."
    - "Icon click toggles (closes) side panel: open side panel (e.g. via command or direct URL), wait >400ms, simulate icon click again and assert panel closes (e.g. side panel page/window no longer visible)."
    - "Options toggle: load options page, set 'Single click opens popup', save; simulate icon click and assert popup opens (e.g. popup URL in a new page) instead of side panel."
    - "Suggested location: tests/playwright/extension-icon-click.spec.js or extend extension-messaging.spec.js; use same unpacked-extension fixture as other extension E2E."
  essence_pseudocode: "# [IMPL-ICON_CLICK_BEHAVIOR] [ARCH-ICON_CLICK_BEHAVIOR] [REQ-ICON_CLICK_BEHAVIOR]\n# Icon click opens side panel (default) or popup; when side panel, click toggles (close if already open).\nINPUT: user clicks extension toolbar icon\nOUTPUT: side panel opens or closes (toggle) when option enabled; else popup opens\nDATA: SW _iconClickOpensSidePanel (cached), _sidePanelWindowId; panel _sidePanelLoadTime; MESSAGE_TYPES.REQUEST_SIDE_PANEL_CLOSE\n\n# [REQ-ICON_CLICK_BEHAVIOR] [ARCH-ICON_CLICK_BEHAVIOR] [IMPL-ICON_CLICK_BEHAVIOR]\n# Manifest: no default_popup so onClicked fires.\nmanifest action: default_icon, default_title; no default_popup\n\n# [REQ-ICON_CLICK_BEHAVIOR] [IMPL-ICON_CLICK_BEHAVIOR]\n# Config: iconClickOpensSidePanel default true; schema optional boolean.\ngetDefaultConfiguration(): iconClickOpensSidePanel: true\nmergedConfigSchema: iconClickOpensSidePanel: z.boolean().optional()\n\n# [REQ-ICON_CLICK_BEHAVIOR] [IMPL-ICON_CLICK_BEHAVIOR]\n# Options: toggle bound to iconClickOpensSidePanel; load and save with other settings.\nloadSettings: set checkbox from config.iconClickOpensSidePanel\nsaveSettings: include iconClickOpensSidePanel from checkbox in updateConfig\n\n# [REQ-ICON_CLICK_BEHAVIOR] [ARCH-ICON_CLICK_BEHAVIOR] [IMPL-ICON_CLICK_BEHAVIOR]\n# SW: cache preference so handler stays synchronous (user gesture required for sidePanel.open).\n_seedIconClickPreferenceCache():\n  getConfig().then(c => this._iconClickOpensSidePanel = c.iconClickOpensSidePanel)\n  storage.onChanged.addListener(changes, areaName => IF areaName === 'local' AND changes.hoverboard_settings THEN getConfig().then(...))\n\n# [REQ-ICON_CLICK_BEHAVIOR] [ARCH-ICON_CLICK_BEHAVIOR] [IMPL-ICON_CLICK_BEHAVIOR]\n# SW: listener passes tab from Chrome into handleActionClick(tab).\naction.onClicked.addListener((tab) => handleActionClick(tab))\n\n# [REQ-ICON_CLICK_BEHAVIOR] [ARCH-ICON_CLICK_BEHAVIOR] [IMPL-ICON_CLICK_BEHAVIOR]\n# SW handleActionClick(tab): prefer clicked window; Chrome requires sidePanel.open() in same synchronous user-gesture stack.\nhandleActionClick(tab):\n  openSidePanel = (this._iconClickOpensSidePanel !== false)\n  IF NOT openSidePanel: action.openPopup(); RETURN\n  IF NOT sidePanel.open available: action.openPopup(); RETURN\n  # [IMPL-ICON_CLICK_BEHAVIOR] Prefer clicked window: use tab from onClicked when provided, else cache.\n  clickedWindowId = tab?.windowId != null ? tab.windowId : null\n  cachedWindowId = this._sidePanelWindowId\n  useWindowId = clickedWindowId != null ? clickedWindowId : cachedWindowId\n  IF useWindowId != null:\n    IF clickedWindowId != null AND NOT _isRestrictedForSidePanel(tab?.url): this._sidePanelWindowId = clickedWindowId\n    sidePanel.open({ windowId: useWindowId }); windows.update(useWindowId, { focused: true }); sendMessage(REQUEST_SIDE_PANEL_CLOSE); RETURN\n  # [IMPL-ICON_CLICK_BEHAVIOR] Cold start: no tab and no cache; do NOT call sidePanel.open in async callback (gesture would be lost). Seed cache for next click; open popup as fallback.\n  tabs.query({ active: true, currentWindow: true }, (tabs) =>\n    tabFromQuery = tabs?.[0]\n    IF tabFromQuery?.windowId != null AND NOT _isRestrictedForSidePanel(tabFromQuery.url): this._sidePanelWindowId = tabFromQuery.windowId\n  )\n  action.openPopup()\n\n# [REQ-ICON_CLICK_BEHAVIOR] [IMPL-ICON_CLICK_BEHAVIOR]\n# Side panel: on REQUEST_SIDE_PANEL_CLOSE close if visible and open long enough (toggle).\nbindToggleCloseRequest():\n  runtime.onMessage.addListener(message =>\n    IF message?.type !== REQUEST_SIDE_PANEL_CLOSE RETURN\n    IF document.visibilityState !== 'visible' RETURN\n    IF (Date.now() - _sidePanelLoadTime) < 300 RETURN\n    window.close())\n"
  implementation_approach:
    details:
      - "ConfigManager: getDefaultConfiguration() add iconClickOpensSidePanel: true; mergedConfigSchema add iconClickOpensSidePanel: z.boolean().optional()"
      - "manifest.json: remove action.default_popup (keep default_icon, default_title)"
      - "Options: new control (e.g. checkbox id icon-click-opens-side-panel); loadSettings/saveSettings read and write the key"
      - "Side panel: _sidePanelLoadTime at script load; bindToggleCloseRequest() listens for REQUEST_SIDE_PANEL_CLOSE; if visibilityState === 'visible' and (now - loadTime) > 300ms then window.close()"
      - "SW: _iconClickOpensSidePanel cache; _seedIconClickPreferenceCache() at startup and on storage.onChanged(hoverboard_settings); action.onClicked.addListener((tab) => handleActionClick(tab)); handleActionClick(tab) uses clickedWindowId = tab?.windowId, useWindowId = clickedWindowId ?? cachedWindowId, calls sidePanel.open({ windowId: useWindowId }) synchronously (Chrome user-gesture requirement); when clickedWindowId present and tab URL not restricted, set _sidePanelWindowId = clickedWindowId; then windows.update(useWindowId, { focused: true }), sendMessage(REQUEST_SIDE_PANEL_CLOSE). Cold start (no tab, no cache): tabs.query({ active: true, currentWindow: true }, cb) to seed cache only, action.openPopup() (do not call sidePanel.open in callback—gesture is lost). Commands/context menu/OPEN_SIDE_PANEL use _openSidePanelWithFallback()."
    summary: "manifest.json action has no default_popup; ConfigManager has iconClickOpensSidePanel (default true); options page has toggle; SW caches preference and _sidePanelWindowId; action.onClicked.addListener((tab) => handleActionClick(tab)); handleActionClick(tab) uses clickedWindowId = tab?.windowId, useWindowId = clickedWindowId ?? cachedWindowId, calls sidePanel.open({ windowId: useWindowId }) synchronously; when clickedWindowId is set and tab URL is not restricted, set _sidePanelWindowId = clickedWindowId; cold start (no tab, no cache) seeds cache via tabs.query and openPopup only. Commands/context menu/OPEN_SIDE_PANEL use _openSidePanelWithFallback() (cached or cold-start)."
