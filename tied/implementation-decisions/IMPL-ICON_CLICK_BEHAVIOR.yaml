  e2e_recommendations:
    - "Icon click cold-start: immediately after browser/extension load, click extension icon and assert side panel opens."
    - "Icon click toggles (closes) side panel on web tabs after >400ms open."
    - "Non-web badge: when active tab is chrome:// (or similar), assert tools-toolbar.html popup path is set; gesture-bound action.openPopup/sidePanel.open remains E2E-deferred when fixture cannot invoke toolbar click ([IMPL-NON_WEB_TOOLS_TOOLBAR])."
    - "Options toggle: Single click opens popup; simulate icon click and assert popup."
    - "Suggested location: tests/playwright/extension-icon-click.spec.js; non-web surface assertions also in extension-usage-tracking.spec.js"
  essence_pseudocode_path: "implementation-decisions/IMPL-ICON_CLICK_BEHAVIOR-pseudocode.md"
  implementation_approach:
    details:
      - "Commands/context menu/OPEN_SIDE_PANEL use _openSidePanelOrToolsToolbar (non-web → tools toolbar)"
      - "ConfigManager: getDefaultConfiguration() add iconClickOpensSidePanel: true; mergedConfigSchema add iconClickOpensSidePanel: z.boolean().optional()"
      - "manifest.json: remove action.default_popup (keep default_icon, default_title)"
      - "Options: toggle bound to iconClickOpensSidePanel; load and save with other settings"
      - "Side panel: bindToggleCloseRequest listens for REQUEST_SIDE_PANEL_CLOSE; close if visible long enough"
      - "SW handleActionClick(tab): if tab URL non-web (IMPL-NON_WEB_TOOLS_TOOLBAR), _openToolsToolbar(tab) and return — do not sidePanel.open"
      - "SW web path: prefer clicked window; sidePanel.open synchronously; cold start seeds cache and openPopup only"
    summary: "Icon click opens side panel (default) or popup; on non-web tabs routes to tools toolbar per IMPL-NON_WEB_TOOLS_TOOLBAR."
