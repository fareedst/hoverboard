  essence_pseudocode_path: "implementation-decisions/IMPL-PAGE_ARCHIVE_STORAGE-pseudocode.md"
  implementation_approach:
    details:
      - "All adapter writes are atomic from the caller perspective and return explicit success/error outcomes."
      - "Archive record contains url, archiveId, version, capturedAt, sourceTitle, contentHash, sanitizedHtml, textContent, status, artifact references, and optional sourcePresentationProfile."
      - "Association failure restores the prior archive or removes the new archive version and returns cleanup diagnostics."
      - "Capture uses Readability extraction plus sanitized HTML; AI tagging retains its 16000-character payload cap as a separate option."
      - "CAPTURE_PAGE_ARCHIVE passes an explicit preferredBackend to the selected-backend association orchestrator; archive persistence precedes missing-bookmark creation and preserves existing bookmark metadata."
      - "Local persistence uses a quota-appropriate archive adapter separate from hoverboard_local_bookmarks; File persistence uses a versioned archive file/directory separate from hoverboard-bookmarks.json."
      - "normalizeSourcePresentationProfile allowlists canonical opaque colors and light/dark intent, caps serialized profile size, and omits invalid values."
      - "Only Local and File backend values resolve to archive adapters; an unconfigured File archive adapter returns UnsupportedBackend instead of silently using memory."
      - "Reader lookup/list/delete paths operate on persisted archive records and synchronize derived archive search state."
      - "sourcePresentationProfile is excluded from archiveId and contentHash inputs so presentation changes do not change archive identity."
      - "The executeScript capture boundary extracts only computed background, text, link, and color-scheme intent by walking body ancestors; it never copies source CSS."
    summary: "Capture, sanitize, normalize, persist, retrieve, and delete Local/File page archive artifacts through mockable adapters, with bounded source presentation metadata kept outside archive identity."
  metadata:
    created:
      author: "AI Agent"
      date: "2026-07-31"
    last_updated:
      author: "AI Agent"
      date: "2026-08-01"
      reason: "Add bounded source presentation extraction, normalization, and hash exclusion"
  name: "Page Archive Storage Implementation"
  rationale:
    benefits:
      - "Mockable adapters and deterministic lifecycle."
      - "Sanitized HTML and extracted text can serve Reader and search."
    problems_solved:
      - "Capture, recapture, deletion, and search need stable archive identity."
      - "Durable page content has no storage boundary."
    why: "Keep large archive content out of bookmark metadata while sharing one lifecycle contract across Local and File storage."
