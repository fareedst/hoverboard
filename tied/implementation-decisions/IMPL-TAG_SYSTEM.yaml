  implementation_approach:
    summary: TagService with sanitization; user-driven recent tags via service-worker recentTagsMemory + chrome.storage.local policy (N-minute window); optional display cache and frequency for suggestions
    details:
      - sanitizeTag before persist/display
      - getUserRecentTags / getRecentTagsForUi policy path; getRecentTags cache-first then user-recent
      - addTagToUserRecentList → recentTagsMemory.addTag
      - getUserRecentTagsExcludingCurrent for getRecentBookmarks handler and UI chips
      - Tag frequency / processTagsForDisplay for suggestions
