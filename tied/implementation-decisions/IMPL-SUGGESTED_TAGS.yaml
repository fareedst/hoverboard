  essence_pseudocode: |
    # [IMPL-SUGGESTED_TAGS] [ARCH-SUGGESTED_TAGS] [REQ-SUGGESTED_TAGS_FROM_CONTENT] [REQ-SUGGESTED_TAGS_DEDUPLICATION] [REQ-SUGGESTED_TAGS_CASE_PRESERVATION]
    # Summary: Suggested tags from page content — overlay via TagService pipeline; Chromium popup via MAIN-world snippet that registers the extractor global, then PopupController orchestration shared with [IMPL-THIS_PAGE_TAG_SORT].
    # Composition: composed_with [IMPL-SELECTION_TO_TAG_INPUT] — selection prefill and suggested-tag load both touch UIManager tag input / chips but are independent flows (no required ordering); shared post-condition: user may add tags from either path. Cross-IMPL [IMPL-THIS_PAGE_TAG_SORT]: popup path relies on this IMPL for snippet tier semantics and global name __hoverboardExtractSuggestedTagsWithRelevance; inject file-before-func ordering is owned by IMPL-THIS_PAGE_TAG_SORT loadSuggestedTags.

    # How — Overlay IO contract: INPUT document, url, limit; OUTPUT deduplicated string list per pipeline below; DATA multi-source caps + noise/delimiter as in TagService.
    INPUT: document, url, limit (defaults per path)
    OUTPUT: list of tag strings (frequency-ordered within extractor, case-preserved, deduplicated)
    DATA: sources = title, URL segments, meta, headings, emphasis, definitions, table headers/captions, nav, breadcrumbs, image alts, main links (each capped); noise set; delimiter regex

    # How — Chromium popup consumer: after [IMPL-THIS_PAGE_TAG_SORT] normalizes inject results, UIManager receives { tag, relevance, inPageFrequency }[]; optional three-way chip reorder is IMPL-THIS_PAGE_TAG_SORT / UIManager.

    # How — extractSuggestedTags core steps implement dedupe, case preservation, and limits per ARCH-SUGGESTED_TAGS.
    extractSuggestedTags(document, url, limit):
      allTexts = gather capped sources
      words = tokenize(join allTexts)
      filtered = filter noise, min length, not pure number
      wordFrequency = count by lowercase; originalCaseMap = first-seen case
      sorted = sort by frequency desc then alphabetical lowercase
      tagsWithVersions = expand case variants per dedupe rules
      sanitized = sanitize, unique exact strings
      RETURN slice to limit

    # [IMPL-SUGGESTED_TAGS] [ARCH-SUGGESTED_TAGS] [REQ-SUGGESTED_TAGS_FROM_CONTENT] [REQ-SUGGESTED_TAGS_DEDUPLICATION] [REQ-SUGGESTED_TAGS_CASE_PRESERVATION]
    # How — Overlay entrypoint: TagService.extractSuggestedTagsFromContent(document, url, limit).

    # [IMPL-SUGGESTED_TAGS] [IMPL-THIS_PAGE_TAG_SORT] [ARCH-SUGGESTED_TAGS] [ARCH-THIS_PAGE_TAG_SORT] [REQ-SUGGESTED_TAGS_FROM_CONTENT] [REQ-THIS_PAGE_TAG_SORT]
    # How — Chromium popup: suggested-tags-main-world-snippet.js defines DOM tiering and sets global __hoverboardExtractSuggestedTagsWithRelevance; PopupController (IMPL-THIS_PAGE_TAG_SORT) runs executeScript MAIN files then func, normalizes rows, filters current bookmark tags CI, empty list on failure — see paired IMPL for full control flow.
