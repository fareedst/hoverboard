    details:
      - "Side-panel mismatch actions persist one full bookmark update only after authoritative re-read and successful replacement; the replacement value is the clicked case-converted Suggested Tag label; popup and overlay filtering/add flows remain unchanged."
      - "Side-panel This Page classifies normalized suggestions as absent, case-match, or case-mismatch using src/shared/suggested-tag-state.js; exact matches are suppressed while mismatch rows retain canonical source data for classification and expose the converted value only at the chip action boundary."
      - "The pure replacement helper performs one in-place case-insensitive replacement, removes duplicate variants of the replaced tag, preserves unrelated order, and returns no-mutating failure results for invalid or stale input."
      - "When UIManager is scoped to #bookmarkPanel, its loading transition captures the container scrollTop before hiding mainInterface and restores the saved value after showing it again. This covers Suggested Tag add, exact-match removal, and case-mismatch replacement, including input-focus and chip-redraw effects, while the standalone popup remains unchanged."
    summary: "Extract from title, URL, meta, headings, emphasis, definitions, tables, nav, breadcrumbs, images, links (per-source limits). Tokenize, filter noise, frequency sort, case preservation, sanitize, deduplicate, apply limit. Overlay: TagService.extractSuggestedTagsFromContent. Popup (Chromium): chrome.scripting.executeScript MAIN files (suggested-tags-main-world-snippet.js) then func calling global extractor; PopupController normalizes to { tag, relevance, inPageFrequency } and filters current bookmark tags before updateSuggestedTags."
