    - "REQ-QUICK_ACCESS_ENTRY"
  essence_pseudocode_path: "implementation-decisions/IMPL-EXTENSION_COMMANDS-pseudocode.md"
  implementation_approach:
    details:
      - "manifest commands: open-side-panel (no suggested_key), open-side-panel-bookmark (Ctrl+Shift+1), open-side-panel-tags-tree (Ctrl+Shift+2), open-side-panel-browser-tabs (Ctrl+Shift+3), open-options (no suggested_key), open-bookmarks-index (Ctrl+Shift+B), open-import (no suggested_key). Exactly four suggested_key per Chrome limit."
      - "Side panel: chrome.storage.onChanged for SIDE_PANEL_TAB_STORAGE_KEY; on change call switchTab(newValue) so when panel is already open and user triggers tab command, visible tab updates."
      - "SW handleCommand: open-side-panel: sidePanel.open; open-side-panel-bookmark/tags-tree/browser-tabs: set chrome.storage.local hoverboard_sidepanel_active_tab to 'bookmark'|'tagsTree'|'browserTabs', then sidePanel.open; open-options: openOptionsPage; open-bookmarks-index: OPEN_BOOKMARKS_INDEX_TAB (_openBookmarksIndexTab: tabs.create then REQUEST_SIDE_PANEL_CLOSE); open-import: tabs.create with getURL."
    summary: "manifest.json commands for quick access; open-bookmarks-index uses OPEN_BOOKMARKS_INDEX_TAB (create + dismiss side panel)."
  metadata:
    created:
      author: "AI Agent"
      date: "2026-02-26"
    last_updated:
