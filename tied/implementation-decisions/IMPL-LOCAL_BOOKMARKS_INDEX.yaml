  implementation_approach:
    details:
      - "BookmarkRouter.getAllBookmarksForIndex(): aggregates localProvider.getAllBookmarks() and fileProvider.getAllBookmarks(), adds storage 'local'|'file', merges and sorts by time desc"
      - "LOAD_LOCAL_BOOKMARKS_INDEX: treat aggregate response error or success:false as failure even when bookmarks is []; fallback getLocalBookmarksForIndex"
      - "MessageHandler: handleGetAggregatedBookmarksForIndex calls bookmarkProvider.getAllBookmarksForIndex() when available; handleGetLocalBookmarksForIndex uses LocalBookmarkService only (fallback)"
      - "OPEN_BOOKMARKS_INDEX_TAB (SW _openBookmarksIndexTab): tabs.create index URL then runtime.sendMessage REQUEST_SIDE_PANEL_CLOSE; called from OPEN_BOOKMARKS_INDEX message, open-bookmarks-index command, hoverboard-open-bookmarks-index menu"
      - "Popup: bookmarksIndexBtn emits openBookmarksIndex; PopupController.handleOpenBookmarksIndex sends OPEN_BOOKMARKS_INDEX (not direct tabs.create). Options: bookmarks-index-link href set to extension URL (no dismiss)"
      - "Service worker: serialize initBookmarkProvider behind in-flight promise so concurrent cold-start messages share one init"
      - "src/ui/bookmarks-table/: HTML (search, filters, table with Storage column, empty state), JS (loadBookmarks uses aggregated then fallback, renderTableBody shows Storage, sort by storage), CSS (table, sort indicators); index init must not send REQUEST_SIDE_PANEL_CLOSE"
      - "Store checkbox change: applySearchAndFilter; if allBookmarks empty and at least one store checked, reload via shouldReloadBookmarksOnStoreChange (bookmarks-table-load.js)"
    summary: "Index page with Storage column; OPEN_BOOKMARKS_INDEX_TAB creates tab and dismisses side panel; LOAD_LOCAL_BOOKMARKS_INDEX treats aggregate error/success:false as failure; store-change reload when allBookmarks empty; SW PROVIDER_INIT_MUTEX; Bulk Delete preferredBackend + #delete-result."
