      - "tests/unit/browser-tabs-panel.test.js"
      - "tests/unit/service-worker-messaging-routing.test.js"
      - "tests/unit/side-panel-tabs.test.js"
  validation_criteria:
    - method: "Unit tests"
      coverage: "filterBrowserTabs: empty query returns all; scope-aware filter (tabInfo/pageText/importantTags); build URL list and buildRecordsYamlForCopy; Copy Records button; GET_TAB_REFERRERS and GET_TABS_PAGE_TEXT, GET_TABS_IMPORTANT_TAGS; panel merges referrer and pageText/importantTags from SW; batch set/clear to-read and add tags; clickable window/tab id (focus window and tab on click); clickable title/URL in title and url display mode (focus link, windows.update/tabs.update); per-row close-tab button (data-action=closeTab) before ids/focus link, chrome.tabs.remove on click; remove icon after text in title/url mode, before Tags in block; display bookmark tags per tab; display mode and remove-from-display; sections and tooltips; favicon in list; parse important-tag sources; Gather (tabs.move to current window); Distribute (windows.create per tab when window has >1 tab); mergeBookmarkReplyIntoTab maps getCurrentBookmark (tags, toread, shared) to row fields; per-row to-read/private indicators in Title, URL, and Block modes; refreshBookmarkDisplayForAllTabs after batch Add tags, Set to-read, and Clear to-read"
