REQ-QUALITY_ASSURANCE_EVIDENCE:
  category: "Non-Functional"
  description: "Every behavior-changing change selects applicable quality attributes from a bounded risk profile and records reproducible evidence, limitations, and accepted residual risk without imposing irrelevant checks."
  metadata:
    created:
      author: "AI Agent"
      date: "2026-08-02"
    last_updated:
      author: "AI Agent"
      date: "2026-08-02"
      reason: "Formalize quality module ownership and complete unit/composition/pilot traceability"
  name: "Risk-triggered quality assurance evidence"
  priority: "P0"
  rationale:
    benefits:
      - "Evidence provenance and residual-risk decisions remain auditable."
      - "Risk-triggered quality work with explicit N/A rationale."
    problems_solved:
      - "Quality checks are currently described without a common applicability and evidence contract."
      - "TIED consistency and marker scans can be mistaken for proof of runtime quality."
    why: "TIED needs quality claims to be scoped, reproducible, and reviewable beyond functional traceability."
  related_requirements:
    depends_on:
      - "REQ-MODULE_VALIDATION"
      - "REQ-TIED_SETUP"
    related_to: []
    supersedes: []
  satisfaction_criteria:
    - criterion: "Each behavior-changing change records applicable or N/A quality attributes with rationale, evidence method, threshold, owner, and limitation."
      metric: "Every selected quality row has a reproducible evidence reference or an owned, expiring waiver."
    - criterion: "Evidence distinguishes TIED artifact integrity from runtime quality claims."
      metric: "Verification output labels proof boundaries and does not claim universal correctness."
    - criterion: "The existing IMPL-before-RED-before-code and module/composition test order remains mandatory."
      metric: "Checklist and pilot tests preserve the existing sequence."
  status: "Implemented"
  traceability:
    architecture:
      - "ARCH-QUALITY_ASSURANCE_PROFILES"
    code_annotations:
      - "REQ-QUALITY_ASSURANCE_EVIDENCE"
    implementation:
