      - "mcp-server/src/analysis/traceability-gap.test.ts"
      - "mcp-server/src/quality-adequacy.test.ts"
      - "mcp-server/src/quality-command-runner.test.ts"
      - "mcp-server/src/quality-evidence-collection.test.ts"
      - "mcp-server/src/quality-evidence.test.ts"
      - "mcp-server/src/quality-security.test.ts"
      - "mcp-server/src/tools/quality-validation-mcp.test.ts"
