      - "REQ-TIED_SETUP"
    related_to: []
    supersedes: []
  satisfaction_criteria:
    - criterion: "All logical modules identified and documented with clear boundaries before development"
    - criterion: "Module interfaces and contracts defined and documented"
    - criterion: "Module validation criteria specified for each module"
      metric: "What 'validated' means is explicitly defined"
    - criterion: "Each module developed independently"
    - criterion: "Each module passes independent validation before integration"
      metric: "Unit tests with mocks, contract validation, edge case testing, error handling validation all passing"
    - criterion: "Every binding between validated modules has composition evidence before integration"
      metric: "Binding inventory lists trigger, callee, arguments, effect, ordering, failure behavior; each composition-testable binding has a UI-free composition test (component/integration/contract) that fails before wiring and passes after"
    - criterion: "Integration only occurs after module validation and composition gates pass"
    - criterion: "Integration tasks separate from module development tasks"
    - criterion: "Minimize code measurable only from outside testing (E2E/manual); every IMPL has test strategy (unit, composition/integration, or E2E-only with named platform constraint)"
    - criterion: "Module validation results documented"
    - criterion: "Module validation terminology (module validation, independent validation before integration, binding inventory, composition evidence) is canonical in tied/vocab/tied-methodology.md; logical unit names align with UPPER_SNAKE blocks in sibling glossaries"
    - criterion: "No non-trivial logic in entry points unless documented as glue with reason; entry-point bindings remain composition-testable by default"
