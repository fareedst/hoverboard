ARCH-QUALITY_ASSURANCE_PROFILES:
  alternatives_considered:
    - name: "Universal quality checklist"
      cons:
        - "Imposes irrelevant ceremony and expensive evidence"
      pros:
        - "Simple to describe"
      rejected_reason: "Conflicts with risk-triggered applicability."
    - name: "TIED consistency as complete quality proof"
      cons:
        - "Does not exercise runtime security, performance, resilience, usability, or compliance behavior"
      pros:
        - "Uses an existing gate"
      rejected_reason: "Proof boundary is technically false."
  cross_references:
    - "REQ-QUALITY_ASSURANCE_EVIDENCE"
  decision: "Quality assurance is selected through versioned risk profiles. Each applicable quality attribute produces a measurable evidence row; N/A decisions require rationale, owner, and expiry when risk is accepted. TIED consistency validates artifact integrity but does not prove runtime quality."
  implementation_approach:
    details:
      - "Baseline functional profile is always considered; other profiles activate from change boundaries and risk signals."
      - "Dedicated ownership covers manifest generation, command execution, command-to-manifest collection, security profile validation, Layer B pseudo-code validation, binding inventory validation, test adequacy validation, and the webhook pilot."
      - "Evidence rows include applicability, rationale, risk, method, command/test, threshold, result, owner, limitation, and waiver/expiry."
      - "Execution order remains IMPL pseudo-code validation, RED, GREEN, composition, justified E2E, and verification."
    key_components:
      - "Bounded scenario and abuse-case matrix"
      - "Quality applicability matrix"
      - "Residual-risk and waiver record"
      - "Verification evidence manifest"
    summary: "Add a versioned profile model to CITDP and checklist artifacts, generate machine evidence manifests, validate structural and risk-relative plans, and retain human residual-risk decisions separately."
  metadata:
    created:
      author: "AI Agent"
      date: "2026-08-02"
    last_updated:
      author: "AI Agent"
      date: "2026-08-02"
      reason: "Formalize dedicated quality implementation ownership and composition evidence"
    last_validated:
      date: "2026-08-02"
      result: "pending"
      validator: "AI Agent"
  name: "Risk-triggered quality assurance profiles and evidence boundary"
  rationale:
    benefits:
      - "Bounded applicability and explicit proof boundaries."
      - "Reusable profile contracts for security, data, resilience, performance, accessibility, privacy, compliance, AI, and test adequacy."
    problems_solved:
      - "Evidence and human risk decisions are not separated from structural traceability validation."
      - "Unbounded quality checklists create irrelevant work."
    why: "A profile-based model provides safety and evidence for high-risk changes without imposing universal ceremony on low-risk changes."
  related_decisions:
    depends_on:
