ARCH-LOCAL_BOOKMARKS_INDEX:
  alternatives_considered: []
  bulk_delete: "**Delete** button in Actions for selected; confirmation shows record count; if ≤8 selected, bookmark names listed. Uses deleteBookmark message per selected URL with preferredBackend from the row Storage column (buildDeletePayload). After confirm, #delete-result shows pending Deleting… (warning); after the loop, final Deleted N… counts (success), matching Import #import-result UX. Table refreshes and selection clears after delete."
  bulk_move: "**Move selected to** (Local | File | Sync) + Move button; uses existing moveBookmarkToStorage message per selected URL [REQ-MOVE_BOOKMARK_STORAGE_UI]. Move controls disabled when no selection; enabled when one or more bookmarks selected."
  count_footer: "**Bookmark count at bottom of page and always visible** [REQ-LOCAL_BOOKMARKS_INDEX]: The row count (# bookmarks) lives in a dedicated footer block (.footer-info), the last content in the main container; a .footer-spacer (flex: 1 1 0) before it pushes the footer to the visual bottom when content is short. .footer-info uses position: sticky; bottom: 0 so when content is long the count bar stays visible at the bottom of the viewport while scrolling. html/body min-height: 100vh and body flex column; container flex: 1 and min-height: 100vh."
  cross-references: "REQ-LOCAL_BOOKMARKS_INDEX, IMPL-LOCAL_BOOKMARKS_INDEX, ARCH-STORAGE_INDEX_AND_ROUTER"
  cross_references: &ref_0 []
  decision: "A **single extension page** (e.g. `bookmarks-table.html`) displays a table of **local, file, and sync bookmarks** (non-Pinboard). Data from **getAggregatedBookmarksForIndex** (or fallback **getLocalBookmarksForIndex**). Aggregate responses with error or success:false trigger local fallback even when bookmarks is []. **Stores** group: Local, File, Sync checkboxes; default all unchecked. When a store checkbox changes and allBookmarks is empty while at least one store is checked, re-run LOAD_LOCAL_BOOKMARKS_INDEX (store-change reload) so a failed/empty first fetch can recover without a full page reload. SW serializes bookmark provider init (PROVIDER_INIT_MUTEX) for concurrent cold-start messages. **Show only** group: tags include, to-read, private, time range (Start/End, time field); **Clear** button resets Show only to defaults. **Table Display** group: Time column (Create time | Last updated), Time format (Absolute | Age). **Hide** group: tags exclude. **Compact layout** (reduced whitespace) to maximize table space. **Actions for selected**: Export, Move, **Delete** (confirmation; if ≤8 selected, show names), Import. Table: **Select** column, **Storage** column, **Time** column [REQ-BOOKMARK_CREATE_UPDATE_TIMES], **search**, sortable columns, **launchable URLs** with **external-link indicator**. Empty state when no store checked or no data. **Index open**: SW-owned OPEN_BOOKMARKS_INDEX_TAB creates the tab then broadcasts REQUEST_SIDE_PANEL_CLOSE so an already-open side panel is dismissed (popup/command/context menu); index page load/refresh does not dismiss; toolbar icon may reopen [REQ-ICON_CLICK_BEHAVIOR]."
  filters: "**Stores** (checkboxes Local/File/Sync; empty set → 0 rows). Store checkbox change refilters; if allBookmarks empty and ≥1 store checked, store-change reload re-fetches. **Show only:** tag include, to-read, private, time range (Start/End, time field Create time | Last updated); **Clear** resets Show only to defaults. **Hide:** tags exclude. All client-side; applied in order: stores → search → show-only → hide."
  getaggregatedbookmarksforindex: "Handled by calling `bookmarkProvider.getAllBookmarksForIndex()` when the provider is BookmarkRouter; router aggregates local, file, and sync providers, adds `storage: 'local'` | 'file' | 'sync', merges and sorts by time desc."
  getlocalbookmarksforindex: "Fallback when aggregated is unavailable or aggregate response has error or success:false (even when bookmarks is []); uses LocalBookmarkService directly, returns local bookmarks only (index page tags each with `storage: 'local'`)."
  implementation_approach:
    details: []
    summary: "Single extension page for local/file/sync bookmarks with Stores/Show only/Hide/Table Display; aggregate failure fallback + store-change reload; SW OPEN_BOOKMARKS_INDEX_TAB + PROVIDER_INIT_MUTEX; Bulk Delete preferredBackend + #delete-result."
  launch: "URL column is `<a href=\"...\" target=\"_blank\" rel=\"noopener\">` with **external-link indicator** (e.g. ↗) and title \"Opens in new tab\"."
  layout: "Page uses **compact layout**: reduced padding and margins (e.g. --space-2, --space-3) for container, header, toolbar, toolbar groups, filters row, actions group, and table wrapper so the table receives maximum space."
