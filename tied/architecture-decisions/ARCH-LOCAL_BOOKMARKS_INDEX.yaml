ARCH-LOCAL_BOOKMARKS_INDEX:
  alternatives_considered: []
  bulk_delete: "**Delete** button in Actions for selected; confirmation shows record count; if ≤8 selected, bookmark names listed. Uses deleteBookmark message per selected URL with preferredBackend from the row Storage column (buildDeletePayload). After confirm, #delete-result shows pending Deleting… (warning); after the loop, final Deleted N… counts (success), matching Import #import-result UX. Table refreshes and selection clears after delete."
  bulk_move: "Move selected to (Local | File | Sync | Browser) + Move button; uses moveBookmarkToStorage message per selected URL [REQ-MOVE_BOOKMARK_STORAGE_UI] [REQ-BROWSER_BOOKMARK_STORAGE]. Move controls disabled when no selection."
  count_footer: "**Bookmark count at bottom of page and always visible** [REQ-LOCAL_BOOKMARKS_INDEX]: The row count (# bookmarks) lives in a dedicated footer block (.footer-info), the last content in the main container; a .footer-spacer (flex: 1 1 0) before it pushes the footer to the visual bottom when content is short. .footer-info uses position: sticky; bottom: 0 so when content is long the count bar stays visible at the bottom of the viewport while scrolling. html/body min-height: 100vh and body flex column; container flex: 1 and min-height: 100vh."
  cross-references: "REQ-LOCAL_BOOKMARKS_INDEX, IMPL-LOCAL_BOOKMARKS_INDEX, ARCH-STORAGE_INDEX_AND_ROUTER"
  cross_references: []
  decision: "A single extension page (e.g. bookmarks-table.html) displays a table of local, file, sync, and browser bookmarks (non-Pinboard). Data from getAggregatedBookmarksForIndex (or fallback getLocalBookmarksForIndex). Aggregate responses with error or success:false trigger local fallback even when bookmarks is []. Stores group: Local, File, Sync, Browser (B) checkboxes; default all unchecked. When a store checkbox changes and allBookmarks is empty while at least one store is checked, re-run LOAD_LOCAL_BOOKMARKS_INDEX (store-change reload). SW serializes bookmark provider init (PROVIDER_INIT_MUTEX). Show only / Hide / Table Display groups as before. Actions for selected: Export, Move (Local|File|Sync|Browser), Delete, Import. Storage column; search; sortable columns; launchable URLs. Index open: SW OPEN_BOOKMARKS_INDEX_TAB creates tab then REQUEST_SIDE_PANEL_CLOSE."
  filters: "Stores (checkboxes Local/File/Sync/Browser; empty set → 0 rows). Store checkbox change refilters; if allBookmarks empty and ≥1 store checked, store-change reload re-fetches. Show only / Hide as before. All client-side; applied in order: stores → search → show-only → hide."
  getaggregatedbookmarksforindex: "Handled by calling bookmarkProvider.getAllBookmarksForIndex() when the provider is BookmarkRouter; router aggregates local, file, sync, and browser providers, adds storage local|file|sync|browser, merges and sorts by time desc."
  getlocalbookmarksforindex: "Fallback when aggregated is unavailable or aggregate response has error or success:false (even when bookmarks is []); uses LocalBookmarkService directly, returns local bookmarks only (index page tags each with `storage: 'local'`)."
  implementation_approach:
    details: []
    summary: "Single extension page for local/file/sync/browser bookmarks with Stores L/F/S/B, Show only/Hide/Table Display; aggregate failure fallback + store-change reload; SW OPEN_BOOKMARKS_INDEX_TAB + PROVIDER_INIT_MUTEX; Bulk Delete preferredBackend + #delete-result."
  launch: "URL column is `<a href=\"...\" target=\"_blank\" rel=\"noopener\">` with **external-link indicator** (e.g. ↗) and title \"Opens in new tab\"."
  layout: "Page uses **compact layout**: reduced padding and margins (e.g. --space-2, --space-3) for container, header, toolbar, toolbar groups, filters row, actions group, and table wrapper so the table receives maximum space."
