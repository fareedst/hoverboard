  selection: "First column **Select**: checkboxes per row, header \"select all\" for visible rows. Selected URLs kept in a Set for bulk operations."
  show_only_clear: "**Show only** group includes a **Clear** button that resets all controls in that group to default (empty tags, to-read and private unchecked, time range cleared, time field = Last updated)."
  sort: "Click column header to sort; toggle asc/desc. Columns: Select, Title, URL, Tags, Time, Storage (Local | File | Sync | Browser), Shared, To read. Default sort: time descending."
  status: "Active"
  sticky_table_display: "**Sticky Table Display and column headers** [REQ-LOCAL_BOOKMARKS_INDEX]: When the user scrolls past the Table Display section, the Table Display block (search, Time column, Time format) and the table column headers (thead) remain fixed at the top of the viewport; the table body scrolls underneath. Implemented with CSS position:sticky on the Table Display fieldset and on the table thead; thead top offset is a CSS variable set from the measured height of the Table Display block so the header row sits directly below it. Content above the Table Display (header, Stores, Show only, Hide) scrolls away normally. Actions for selected and the row count (footer) are not sticky; they scroll with the page content."
  summary: "A single extension page displays local, file, sync, and browser bookmarks (non-Pinboard). Stores L/F/S/B; getAggregatedBookmarksForIndex with local fallback; store-change reload; OPEN_BOOKMARKS_INDEX_TAB dismisses side panel; Actions Export/Move/Delete/Import; Storage column."
  time_column: "Single **Time** column; **Table Display** toolbar group contains **Time column** (Create time | Last updated) and **Time format** (Absolute: YYYY-MM-DD HH:mm:ss | Age: two largest units). [REQ-BOOKMARK_CREATE_UPDATE_TIMES]."
