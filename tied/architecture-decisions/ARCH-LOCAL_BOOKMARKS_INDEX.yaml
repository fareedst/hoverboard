  search: "One text input; case-insensitive substring match on description, url, tags (joined), extended."
  selection: "First column **Select**: checkboxes per row, header \"select all\" for visible rows. Selected URLs kept in a Set for bulk operations."
  show_only_clear: "**Show only** group includes a **Clear** button that resets all controls in that group to default (empty tags, to-read and private unchecked, time range cleared, time field = Last updated)."
  sort: "Click column header to sort; toggle asc/desc. Columns: Select, Title, URL, Tags, Time, Storage (Local | File | Sync | Browser), Shared, To read. Default sort: time descending."
  status: "Active"
  sticky_table_display: "The head control panel remains fixed at the viewport head. The selected Table Display panel and table column headers remain aligned below it while scrolling; the bookmark-list body occupies the space between the head and footer. At the initial table position, column headers remain at the table top; once the list scrolls beneath the head panel, the headers use the measured head offset. The selected footer panel remains fixed at the viewport bottom, and list padding prevents the controls from obscuring rows."
  summary: "Single Local Bookmarks Index page with accessible fixed head/footer control tabs, a viewport-filling bookmark list, and preserved Stores/Show only/Hide/Table Display, Actions/Import/Export behavior."
  table_page: "The Local Bookmarks Index is a full-page table with a fixed head control panel and fixed footer control panel surrounding the bookmark-list viewport. The head tablist exposes Stores (L/F/S/B), Show only, Hide, and Table Display; exactly one head fieldset is visible at a time and Stores is the default. Store checkboxes start checked and each label exposes filtered / total provider-row counts. The footer tablist exposes Actions, Import, and Export; normal loads start collapsed with all footer panels hidden and no selected footer tab, while Actions is the sole keyboard entry with tabindex 0. Activating an inactive footer tab opens exactly that group; activating the active tab collapses the footer while preserving form values. Counts are unavailable or clearly non-applicable for Archived and All resources scopes rather than using stale metadata counts. The fixed head and footer heights are measured into CSS variables; the table header is offset below the head panel only after the list scrolls beneath it, and list spacing prevents either fixed panel from obscuring rows. The bookmark count remains visible at the bottom of the page."
  time_column: "Single **Time** column; **Table Display** toolbar group contains **Time column** (Create time | Last updated) and **Time format** (Absolute: YYYY-MM-DD HH:mm:ss | Age: two largest units). [REQ-BOOKMARK_CREATE_UPDATE_TIMES]."
