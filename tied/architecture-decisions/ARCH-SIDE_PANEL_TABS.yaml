ARCH-SIDE_PANEL_TABS:
  cross_references:
    - "REQ-RECENT_TAGS_SYSTEM"
    - "REQ-SIDE_PANEL_POPUP_EQUIVALENT"
    - "REQ-SIDE_PANEL_TAGS_TREE"
  implementation_approach:
    details:
      - "\"By Tag\" in This Page footer: in panel context, switch to By Tag tab instead of sending OPEN_SIDE_PANEL"
      - "Bookmark panel markup: same structure as popup main (loading, error, main with quick actions, storage, tag management, search) with data-popup-ref on each element"
      - "Layout: Page and tab content use full viewport height and panel width. Override popup-derived body constraints (max-height, width) when in side panel. Tab content area is a flex column so children can distribute space. Tags tree tab: #tagsTreePanel is the scroll container so the above-list div (.tags-tree-above-list) can scroll off the page; the tree list section (.tree-section) uses min-height: 100% so it consumes the full visible height and scrolls its own list."
      - "Modular runtime: side-panel.js facade composes side-panel-controller.js (state/init), side-panel-shell.js (visibility/tab bar), side-panel-event-bindings.js (browser/storage listeners), and side-panel-bookmark-tab.js (scoped Bookmark init); compatibility test hooks remain on the facade."
      - "Scoped This Page loading transitions preserve the bookmark panel container scrollTop after mainInterface visibility, input focus, and content redraw changes; standalone popup loading remains unchanged."
      - "Tab bar: two buttons or links; click switches visible panel and persists choice"
      - "Tags tree panel: current tags-tree sections (config, search, tag selector, tree); IDs remain unique in document"
      - "UIManager must support optional container; when set, cacheElements uses container.querySelector('[data-popup-ref=\"id\"]') instead of document.getElementById"
  metadata:
    last_updated:
      author: "AI Agent"
      date: "2026-08-03"
      reason: "Define scoped This Page scroll preservation across loading transitions"
  name: "Side Panel Tabs Architecture"
  rationale:
    benefits:
      - "Only one panel visible at a time; last-selected tab persisted"
      - "Single panel entry (e.g. side-panel.html); tab bar; Bookmark panel uses UIManager/PopupController with scoped root (container) so element lookup is under that root; Tags tree panel hosts existing tags-tree UI"
    problems_solved:
      - "Duplicate global IDs if both UIs were in the same document"
      - "Side panel showed only tags tree; no popup-equivalent in panel"
    why: "One panel page avoids multiple default_path entries; tabs let users switch between popup-equivalent and tags tree without losing context."
  related_decisions:
    depends_on:
      - "REQ-RECENT_TAGS_SYSTEM"
      - "REQ-SIDE_PANEL_POPUP_EQUIVALENT"
      - "REQ-SIDE_PANEL_TAGS_TREE"
    informs:
      - "IMPL-SIDE_PANEL_BOOKMARK"
      - "IMPL-SIDE_PANEL_TABS"
      - "IMPL-UIManager_SCOPED_ROOT"
    see_also:
      - "ARCH-EXTENSION_BUNDLED_ENTRY_POINTS"
      - "ARCH-SIDE_PANEL_TAGS_TREE"
      - "ARCH-TAG_SYSTEM"
  status: "Active"
