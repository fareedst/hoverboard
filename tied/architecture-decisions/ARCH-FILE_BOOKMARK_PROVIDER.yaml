ARCH-FILE_BOOKMARK_PROVIDER:
  adapter_abstraction: "readBookmarksFile(), writeBookmarksFile(data). Enables unit tests with in-memory mock; real adapter uses File System Access (directory handle + getFileHandle + createWritable/read) in offscreen or options context."
  alternatives_considered: []
  cross-references: "REQ-FILE_BOOKMARK_STORAGE, ARCH-LOCAL_STORAGE_PROVIDER, IMPL-FILE_BOOKMARK_SERVICE"
  cross_references:
    - "ARCH-STORAGE_INDEX_AND_ROUTER"
    - "REQ-FILE_BOOKMARK_STORAGE"
    - "REQ-PER_BOOKMARK_STORAGE_BACKEND"
  decision: "FileBookmarkService is a BookmarkRouter peer provider (backend id file): one user-chosen directory holds hoverboard-bookmarks.json. Same provider contract as local/sync/browser/pinboard. File I/O runs in a document context (offscreen or options) because MV3 service workers cannot use File System Access; directory handle stored in IndexedDB. Historically described as the third backend after Pinboard and Local."
  detail_file: "architecture-decisions/ARCH-FILE_BOOKMARK_PROVIDER.yaml"
  file_format: "`{ \"version\": 1, \"bookmarks\": { \"<url>\": { ... } } }` — same bookmark shape as local storage."
  implementation_approach:
    details:
      - "Adapter abstraction for unit tests with in-memory mock"
      - "Directory handle in IndexedDB; I/O from offscreen or options"
      - "File format: { version: 1, bookmarks: { url: bookmark } }"
      - "Registered in BookmarkRouter VALID_BACKENDS as file"
    summary: "FileBookmarkService implements provider contract; adapter readBookmarksFile/writeBookmarksFile; real adapter uses File System Access in document context."
  metadata:
