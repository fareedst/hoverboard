# [ARCH-ICON_CLICK_BEHAVIOR] [REQ-ICON_CLICK_BEHAVIOR]
# Architecture: Remove action.default_popup so chrome.action.onClicked fires; SW handler reads config and opens side panel or popup.
ARCH-ICON_CLICK_BEHAVIOR:
  cross_references:
    - "REQ-ICON_CLICK_BEHAVIOR"
  detail_file: "architecture-decisions/ARCH-ICON_CLICK_BEHAVIOR.yaml"
  implementation_approach:
    details:
      - "Config: iconClickOpensSidePanel boolean, default true; in getDefaultConfiguration and mergedConfigSchema; options UI bind and save."
      - "Manifest: remove action.default_popup so that clicking the icon does not open a popup automatically; onClicked will fire."
      - "Side panel: on REQUEST_SIDE_PANEL_CLOSE, if document.visibilityState === 'visible' and (Date.now() - loadTime) > threshold, window.close() to implement toggle."
      - "SW: cache iconClickOpensSidePanel at startup and on storage change; onClicked handler receives the tab from chrome.action.onClicked; use that tab's windowId so the panel opens in the window where the user clicked; when tab is not provided, fall back to cached _sidePanelWindowId; no await in handler (user gesture requirement)."
    summary: "Manifest omits action.default_popup; SW registers chrome.action.onClicked; handler receives the tab from Chrome and uses that tab's windowId so the panel opens in the window where the user clicked; when tab is not provided (e.g. programmatic call), fall back to cached _sidePanelWindowId; handler runs synchronously so sidePanel.open() runs in user-gesture context; when opening side panel, SW sends REQUEST_SIDE_PANEL_CLOSE so the panel can close itself if already visible (toggle). Config key iconClickOpensSidePanel (default true) stored via ConfigManager; options page toggle to set it."
  metadata:
    created:
      author: "AI Agent"
      date: "2026-03-02"
    last_updated:
      author: "AI Agent"
      date: "2026-03-03"
      reason: "Handler uses tab from action.onClicked for correct window; fallback to cache when tab not provided"
  name: "Extension Icon Click Behavior Architecture"
  rationale:
    benefits:
      - "Single entry point (onClicked); config (iconClickOpensSidePanel) decides side panel vs action.openPopup()"
    problems_solved:
      - "default_popup prevents onClicked from firing; must remove it to get click events"
    why: "Enable icon click to open side panel (default) or popup by removing the fixed popup and handling click in the service worker with config-driven behavior."
  related_decisions:
    depends_on:
