  decision: "Three surfaces – This Page inline section, Index table columns (Visits, Last Visited), and Visit History standalone page (Most Visited, Recently Visited, Navigation Graph). Data via existing getBookmarkUsage / getBookmarkUsageStats / getBookmarkNavigationGraph messages. Visit History is opened via tools toolbar (tabs.create), not a side-panel tab."
  detail_file: "architecture-decisions/ARCH-BOOKMARK_USAGE_TRACKING_UI.yaml"
  implementation_approach:
    details:
      - Surface 1: "section in This Page / popup"
      - Surface 2: "two new th/td; fetch getBookmarkUsage (no url) after getAggregatedBookmarksForIndex; merge by url; sort keys visits, lastVisited"
      - Surface 3: "standalone visit-history page; initVisitHistoryPage; tools toolbar btn-visit-history"
    summary: "Three surfaces. (1) This Page – Usage section after Storage, visible when visitCount > 0; getBookmarkUsage + getInboundLinks for current URL. (2) Bookmarks Index – Visits and Last Visited columns; merge getAllUsage into table data; sortable. (3) Visit History standalone page (visit-history.html) – Most Visited (getMostFrequent), Recently Visited (getMostRecent), Navigation Graph (getNavigationGraph); Refresh button; launched from tools toolbar."
