    - "Popup inlined: `replace(/[^a-zA-Z0-9_-]/g, '').substring(0, 50)` (simple character filter)"
  data_flow_diagram: "```\nPage Content (DOM + URL)\n         ↓\n    [Extraction]\n    ├─ Title\n    ├─ URL segments\n    ├─ Headings (h1/h2/h3)\n    ├─ Nav links (20)\n    ├─ Breadcrumbs\n    ├─ Images alt (5)\n    └─ Main links (10)\n         ↓\n    [Tokenization]\n    Split on whitespace/punctuation\n         ↓\n    [Filtering]\n    ├─ Remove noise words\n    ├─ Remove short words (<2)\n    ├─ Remove pure numbers\n    └─ Filter URL segments\n         ↓\n    [Frequency Counting]\n    Count occurrences (case-insensitive)\n         ↓\n    [Case Preservation]\n    ├─ Count by lowercase key\n    ├─ Canonical spelling (mixed > ALLCAPS > lower)\n    └─ Remove exact duplicates\n         ↓\n    [Sorting]\n    Sort by frequency ↓, then alphabetically ↑\n         ↓\n    [Sanitization]\n    Remove special chars, limit length\n         ↓\n    [Deduplication vs Current Tags]\n    Exclude suggestions in current tags (case-insensitive)\n         ↓\n    [Display]\n    ├─ Overlay: show 5 tags, click → saveTag + refresh\n    └─ Popup: show all tags, click → add tag\n```\n\n---"
  decision: "Implement intelligent tag suggestions by extracting and analyzing text from multiple page content sources (title, URL, meta tags, headings, semantic emphasis elements, structured content, navigation, breadcrumbs, images, links), filtering noise words, counting word frequency, choosing one canonical spelling per lowercase key (no extra lowercase-only suggestion), and deduplicating against current tags.\n\n---"
  depends_on: "None"
  detail_file: "architecture-decisions/ARCH-SUGGESTED_TAGS.yaml"
  extract_→_filter_→_rank_→_deduplicate_→_display: "1. **Extract text** from multiple page sources (title, URL segments, meta tags, headings, emphasis elements, definition terms, table headers, nav, breadcrumbs, images, links)\n2. **Tokenize and filter** (remove noise words, short words, pure numbers)\n3. **Rank by frequency** (count occurrences, sort descending)\n4. **Preserve case** (one canonical spelling per word; chip case toggle for lower/UPPER display)\n5. **Sanitize** (remove special characters, limit length)\n6. **Deduplicate** (exclude tags already in current bookmark, case-insensitive)\n7. **Display** (show suggestions in UI, allow click-to-add)"
  faster_tagging: "Click-to-add suggestions reduce keystrokes and cognitive load."
  hybrid: "Extract core logic to shared module imported by both paths"
  implementation_approach:
    details:
      - "#### 1. Extraction Sources (in order)\n\n| Source | Selector/Method | Limit | Priority |\n|--------|----------------|-------|----------|\n| Document title | `document.title` | Full text | High |\n| URL path segments | `URL.pathname.split('/')` | All segments (filtered) | High |\n| Meta keywords | `meta[name=\"keywords\"]` | Full content | High |\n| Meta description | `meta[name=\"description\"]` | Full content | High |\n| H1/H2/H3 headings | `querySelectorAll('h1, h2, h3')` | All headings | High |\n| Emphasis elements | `main strong, main b, main em, main i, main mark, main dfn, main cite, main kbd, main code` (+ article, [role=\"main\"], .main, .content) | First 30 elements | Medium-High |\n| Definition terms | `main dl dt` (+ article, [role=\"main\"], .main, .content) | First 20 terms | Medium |\n| Table headers/captions | `main th, main caption` (+ article, [role=\"main\"], .main, .content) | First 20 headers | Medium |\n| Navigation links | `nav a`, `header nav a`, `[role=\"navigation\"] a` | First 20 links | Medium |\n| Breadcrumbs | `[aria-label*=\"breadcrumb\"]`, `.breadcrumb`, etc. | All breadcrumb links | Medium |\n| Main images | `main img`, `article img`, etc. | First 5 images (alt text) | Low |\n| Main links | `main a`, `article a`, etc. | First 10 links | Low |"
      - "**Popup unit test mocking**: In `tests/unit/popup-suggested-tags.test.js`, `chrome.scripting.executeScript` is mocked via Jest `mockResolvedValueOnce([{ result: [...] }])` on the global mock, not by replacing the function. This ensures the implementation's call to `chrome.scripting.executeScript` receives the configured return value reliably across test workers and full-suite runs (replacing the function reference can fail when the implementation uses the same global)."
      - "**Restricted-URL skip (popup)**: Before calling `chrome.scripting.executeScript` in the popup path, the implementation checks that the current tab URL starts with `http://` or `https://`. If not (e.g. extension page, chrome://, file://), it skips injection, calls `updateSuggestedTags([])`, and returns. This prevents \"Cannot access contents of url ... Extension manifest must request permission to access this host\" errors when the user opens the popup while the active tab is an extension page such as the bookmarks table."
      - "**Tokenizer sync (popup vs TagService)**: Popup path uses inlined tokenization; overlay uses TagService. Both must use the same delimiter regex and tokenization logic. Canonical regex: `/[\\s\\.,;:!?\\-_\\(\\)\\[\\]{}\"']+/`. Changing it in only one place breaks suggested tags (see IMPL-SUGGESTED_TAGS popup_tokenizer_sync, regression_lesson_dca25b3)."
      - "```\nPage Content (DOM + URL)\n         ↓\n    [Extraction]\n    ├─ Title\n    ├─ URL segments\n    ├─ Headings (h1/h2/h3)\n    ├─ Nav links (20)\n    ├─ Breadcrumbs\n    ├─ Images alt (5)\n    └─ Main links (10)\n         ↓\n    [Tokenization]\n    Split on whitespace/punctuation\n         ↓\n    [Filtering]\n    ├─ Remove noise words\n    ├─ Remove short words (<2)\n    ├─ Remove pure numbers\n    └─ Filter URL segments\n         ↓\n    [Frequency Counting]\n    Count occurrences (case-insensitive)\n         ↓\n    [Case Preservation]\n    ├─ Count by lowercase key\n    ├─ Canonical spelling (mixed > ALLCAPS > lower)\n    └─ Remove exact duplicates\n         ↓\n    [Sorting]\n    Sort by frequency ↓, then alphabetically ↑\n         ↓\n    [Sanitization]\n    Remove special chars, limit length\n         ↓\n    [Deduplication vs Current Tags]\n    Exclude suggestions in current tags (case-insensitive)\n         ↓\n    [Display]\n    ├─ Overlay: show 5 tags, click → saveTag + refresh\n    └─ Popup: show all tags, click → add tag\n```\n\n---"
      - "For all elements, check `element.title` first, then `childElement.title`, then fall back to `textContent`."
      - "These design choices are implementation details that can be changed without breaking requirements:"
    key_components: "#### 1. Extraction Sources (in order)\n\n| Source | Selector/Method | Limit | Priority |\n|--------|----------------|-------|----------|\n| Document title | `document.title` | Full text | High |\n| URL path segments | `URL.pathname.split('/')` | All segments (filtered) | High |\n| Meta keywords | `meta[name=\"keywords\"]` | Full content | High |\n| Meta description | `meta[name=\"description\"]` | Full content | High |\n| H1/H2/H3 headings | `querySelectorAll('h1, h2, h3')` | All headings | High |\n| Emphasis elements | `main strong, main b, main em, main i, main mark, main dfn, main cite, main kbd, main code` (+ article, [role=\"main\"], .main, .content) | First 30 elements | Medium-High |\n| Definition terms | `main dl dt` (+ article, [role=\"main\"], .main, .content) | First 20 terms | Medium |\n| Table headers/captions | `main th, main caption` (+ article, [role=\"main\"], .main, .content) | First 20 headers | Medium |\n| Navigation links | `nav a`, `header nav a`, `[role=\"navigation\"] a` | First 20 links | Medium |\n| Breadcrumbs | `[aria-label*=\"breadcrumb\"]`, `.breadcrumb`, etc. | All breadcrumb links | Medium |\n| Main images | `main img`, `article img`, etc. | First 5 images (alt text) | Low |\n| Main links | `main a`, `article a`, etc. | First 10 links | Low |"
    summary: "Implement intelligent tag suggestions by extracting and analyzing text from multiple page content sources (title, URL, meta tags, headings, semantic emphasis elements, structured content, navigation, breadcrumbs, images, links), filtering noise words, counting word frequency, choosing one canonical spelling per lowercase key (no extra lowercase-only suggestion), and deduplicating against current tags. The popup path must only run script injection on injectable URLs (`http://`, `https://`); on restricted URLs (e.g. `chrome-extension://`, `chrome://`) it skips injection and shows no suggestions, avoiding Chrome permission errors.\n\n---"
