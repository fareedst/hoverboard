    details: []
    summary: "A storage index in chrome.storage.local maps each bookmark URL to its backend (pinboard | local | file | sync | browser). The BookmarkRouter holds five providers and delegates get/save/delete/tag ops by index or default storage mode; preferredBackend on save/delete follows Save-to / Index Storage column. getBookmarkForUrl races pinboard/local/file/sync only (2C: browser consulted via resolve or when no other non-empty candidate). getAllBookmarksForIndex aggregates local+file+sync+browser. getRecentBookmarks aggregates all five. MessageHandler uses the router as bookmarkProvider."
