ARCH-STORAGE_INDEX_AND_ROUTER:
  alternatives_considered: []
  cross-references: "REQ-PER_BOOKMARK_STORAGE_BACKEND, ARCH-LOCAL_STORAGE_PROVIDER, ARCH-FILE_BOOKMARK_PROVIDER, IMPL-STORAGE_INDEX, IMPL-BOOKMARK_ROUTER"
  cross_references: &ref_0 []
  decision: "A **storage index** in chrome.storage.local maps each bookmark URL to its backend (`pinboard` | `local` | `file` | `sync`). The **BookmarkRouter** holds references to all providers and delegates getBookmarkForUrl, saveBookmark, deleteBookmark, saveTag, deleteTag to the provider indicated by the index (or the default storage mode for new bookmarks). When the popup provides a preferred backend (UI selection), the router uses it for save so save follows the highlight. getRecentBookmarks aggregates results from all providers and returns a single list sorted by time. MessageHandler uses the router as its bookmark provider (duck-typed)."
  detail_file: "architecture-decisions/ARCH-STORAGE_INDEX_AND_ROUTER.yaml"
