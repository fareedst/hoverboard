ARCH-BROWSER_BOOKMARK_IMPORT:
  alternatives_considered:
    - name: "Background script fetches bookmarks, page requests via message"
      cons: "Unnecessary; extension page with permission can call chrome.bookmarks directly"
      pros: "Centralized API"
      rejected_reason: "Simpler to call from page"
  cross-references: "REQ-BROWSER_BOOKMARK_IMPORT, IMPL-BROWSER_BOOKMARK_IMPORT"
  cross_references:
    - "REQ-BROWSER_BOOKMARK_IMPORT"
  decision: "Make the Local Bookmarks Index the single import surface. Its Import control supports both file sources and a live chrome.bookmarks tree source; the live source is flattened, collapsed by cleaned URL, filtered and selected in the Index, then copied through saveBookmark to Local|File|Sync. Conflict detection is scoped to the selected target backend, and Browser is excluded as a destination because it is the source. The former standalone page URL is retained only as a compatibility redirect to the Index with source=browser."
  detail_file: "architecture-decisions/ARCH-BROWSER_BOOKMARK_IMPORT.yaml"
  implementation_approach:
    details:
      - "Add a live Browser source selector and selectable flattened tree list to the Index Import control group"
      - "Collapse duplicate browser URLs before display/import; preserve earliest date and union root-stripped folder tags"
      - "Keep Browser excluded as a live Browser-source destination; file import may still target Browser"
      - "Scope Skip/Overwrite/Merge existing-row lookup to the selected Local|File|Sync target"
    summary: "Index Import supports File and live Browser sources; the legacy standalone URL redirects to Index?source=browser."
  metadata:
    created:
      author: "AI Agent"
      date: "2026-02-18"
    last_updated:
      author: "AI Agent"
      date: "2026-08-03"
      reason: "Align Index-owned Browser import architecture and test boundaries"
    last_validated:
      date: "2026-02-18"
      result: "pass"
      validator: "AI Agent"
  name: "Browser Bookmark Import Architecture"
  rationale:
    benefits:
      - "Root-stripped folder tags and sanitized extra tags preserve the useful migration features of the former standalone page"
      - "Single Local Bookmarks Index Import group supports live chrome.bookmarks.getTree selection with title, URL, folder, date, search, folder filter, and select-all"
      - "Target-specific Skip | Overwrite | Merge handling avoids Browser source rows conflicting with themselves"
    problems_solved:
      - "Aggregate conflict lookup incorrectly treated Browser source rows as target conflicts"
      - "Duplicate import surfaces for file and browser migration"
      - "No storage-aware selective migration from the live browser tree"
    why: "Reuse index-page layout and existing save path; add no backend for reading bookmarks (page calls chrome.bookmarks directly with \"bookmarks\" permission)."
  related:
    - "ARCH-LOCAL_BOOKMARKS_INDEX (layout reference)"
    - "ARCH-LOCAL_BOOKMARKS_INDEX_IMPORT (same save path and conflict concepts)"
    - "IMPL-BROWSER_BOOKMARK_IMPORT (import page UI and flatten + save loop)"
  related_decisions:
    depends_on:
      - "REQ-BROWSER_BOOKMARK_IMPORT"
    informs:
      - "IMPL-BROWSER_BOOKMARK_IMPORT"
    see_also:
      - "ARCH-LOCAL_BOOKMARKS_INDEX"
      - "ARCH-LOCAL_BOOKMARKS_INDEX_IMPORT"
  status: "Active"
  summary: "Browser bookmark import page: Chrome tree source; Import to Local|File|Sync; Browser excluded as import target."
  traceability:
    code_annotations:
      - "ARCH-BROWSER_BOOKMARK_IMPORT"
    implementation:
      - "IMPL-BROWSER_BOOKMARK_IMPORT"
    requirements:
      - "REQ-BROWSER_BOOKMARK_IMPORT"
    tests:
      - "tests/integration/tools-toolbar-launchers-composition.integration.test.js"
      - "tests/playwright/extension-bookmarks-index-controls.spec.js"
      - "tests/playwright/extension-lower.spec.js"
      - "tests/unit/bookmarks-table-browser-import.test.js"
