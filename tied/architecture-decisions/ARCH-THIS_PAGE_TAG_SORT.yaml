ARCH-THIS_PAGE_TAG_SORT:
  rationale:
    why: Users need consistent control over chip order without changing membership.
    problems_solved:
      - Fixed frequency-only ordering from services
      - No relevance signal in UI for suggestions
    benefits:
      - Single shared sort mode in UIManager when side-panel markup includes data-popup-ref tagSortToggle
      - MAIN-world extract script returns tag + relevance + inPageFrequency for suggestion rows
  implementation_approach:
    summary: Pure comparators in tag-chip-sort.js; PopupController refreshes frequency map and uses two-step MAIN inject for relevance-bearing suggestions; UIManager gates sorting on toggle presence.
    details:
      - 'Pure sort module tag-chip-sort.js: alphabetical | frequency | relevance comparators per REQ'
      - 'Bookmark frequency: chrome.storage.local hoverboard_tag_frequency; case-insensitive key lookup'
      - 'Relevance: suggested-tags-main-world-snippet.js assigns integer tier per DOM bucket (headings in main > global headings > nav > breadcrumb > main links > images > meta > title > URL > footer > body fallback); max tier wins per lowercase token'
      - 'executeScript: files inject snippet then func invokes global extractor'
  name: This Page tag sort architecture
  status: Active
  cross_references:
    - REQ-THIS_PAGE_TAG_SORT
    - REQ-SIDE_PANEL_POPUP_EQUIVALENT
    - REQ-SUGGESTED_TAGS_FROM_CONTENT
  decision: Use a shared pure sort module for alphabetical, bookmark-frequency, and DOM-relevance order; UIManager applies it only when the side-panel exposes tagSortToggle. Relevance scores and in-page frequencies come from a MAIN-world snippet injected before the extractor function; bookmark counts come from hoverboard_tag_frequency in chrome.storage.local.
  alternatives_considered:
    - name: Independent sort mode per list (Current vs Recent vs Suggested)
      pros: Finer control per list
      cons: Violates REQ single-mode contract; more UI and state
      rejected_reason: REQ-THIS_PAGE_TAG_SORT requires one mode for all three chip lists
    - name: Persist sort choice across sessions
      pros: User preference recall
      cons: Extra storage and migration; out of REQ scope
      rejected_reason: REQ-THIS_PAGE_TAG_SORT specifies no cross-session persistence
  traceability:
    requirements:
      - REQ-THIS_PAGE_TAG_SORT
