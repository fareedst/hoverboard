ARCH-THIS_PAGE_TAG_SORT:
  alternatives_considered:
    - name: "Independent sort mode per list (Current vs Recent vs Suggested)"
      cons: "Violates REQ single-mode contract; more UI and state"
      pros: "Finer control per list"
      rejected_reason: "REQ-THIS_PAGE_TAG_SORT requires one mode for all three chip lists"
    - name: "Persist sort choice across sessions"
      cons: "Extra storage and migration; out of REQ scope"
      pros: "User preference recall"
      rejected_reason: "REQ-THIS_PAGE_TAG_SORT specifies no cross-session persistence"
