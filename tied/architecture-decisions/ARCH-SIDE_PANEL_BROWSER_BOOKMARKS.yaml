ARCH-SIDE_PANEL_BROWSER_BOOKMARKS:
  cross_references:
    - "REQ-SIDE_PANEL_BROWSER_BOOKMARKS"
  decision: "The Browser Bookmarks page (Chrome tree UI at browser-bookmarks.html) talks directly to chrome.bookmarks for folder-tree UX (getTree, create/update/move/remove, HTML/CSV import-export of the native tree). It is not a side-panel tab (legacy token name SIDE_PANEL_). It is not wired through BookmarkRouter. Distinct from ARCH-BROWSER_BOOKMARK_PROVIDER (Store B). Command open-side-panel-browser-bookmarks and tools-toolbar btn-browser-bookmarks open the page via tabs.create."
  implementation_approach:
    details:
      - Command: "manifest command open-side-panel-browser-bookmarks; SW tabs.create browser-bookmarks.html (legacy command id retained)"
      - Data fetch: "chrome.bookmarks.getTree in page; flatten to list of { id, url, title, dateAdded, folderPath, parentId }; folder tree built recursively with counts"
      - UI: "standalone browser-bookmarks.html; search; folder selector; list; match count; no side-panel tab button"
    summary: "Standalone page uses chrome.bookmarks.getTree; flatten to flat list with folder path; folder tree; filter by query and folder; bulk, undo, import/export, inline edit, keyboard. Opened via tabs.create, not side-panel tab switch."
  metadata:
    created:
      author: "AI Agent"
      date: "2026-03-02"
    last_updated:
      author: "AI Agent"
      date: "2026-07-31"
      reason: "LEAP: standalone Browser Bookmarks page"
  name: "Side Panel Browser Bookmarks Architecture"
  rationale:
    benefits:
      - "Page can show full folder hierarchy and native import/export"
      - "Store B participates in Index/Save-to without replacing the page"
    problems_solved:
      - "Ambiguity between Chrome tree UI surface and Browser storage backend"
      - "Side-panel tab was wrong surface for non-page-bound tree UX"
    why: "Chrome folder tree UX needs direct bookmarks API and a tab-independent full page; Hoverboard Store B needs a router peer — keep both paths with an explicit boundary"
  related_decisions:
    depends_on:
      - "REQ-SIDE_PANEL_BROWSER_BOOKMARKS"
    informs:
      - "IMPL-SIDE_PANEL_BROWSER_BOOKMARKS"
    see_also:
      - "ARCH-BROWSER_BOOKMARK_IMPORT"
      - "ARCH-BROWSER_BOOKMARK_PROVIDER"
      - "ARCH-NON_WEB_TOOLS_TOOLBAR"
      - "ARCH-SIDE_PANEL_TABS"
      - "ARCH-STORAGE_INDEX_AND_ROUTER"
  status: "Active"
  traceability:
    code_annotations:
      - "ARCH-SIDE_PANEL_BROWSER_BOOKMARKS"
    implementation:
      - "IMPL-SIDE_PANEL_BROWSER_BOOKMARKS"
    requirements:
      - "REQ-SIDE_PANEL_BROWSER_BOOKMARKS"
    tests:
      - "tests/unit/browser-bookmarks-panel.test.js"
