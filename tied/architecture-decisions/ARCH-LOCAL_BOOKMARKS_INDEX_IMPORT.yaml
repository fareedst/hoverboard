    informs:
      - "IMPL-LOCAL_BOOKMARKS_INDEX_IMPORT"
    see_also:
      - "ARCH-LOCAL_BOOKMARKS_INDEX"
      - "ARCH-LOCAL_BOOKMARKS_INDEX_EXPORT"
  status: "Active"
  summary: "Import is client-side in a dedicated Import control group: parse CSV/JSON (export format), send each record via saveBookmark with preferredBackend; only-new skips URLs in allBookmarks; overwrite sends all. Pending then final result in #import-result. No new backend message."
  traceability:
