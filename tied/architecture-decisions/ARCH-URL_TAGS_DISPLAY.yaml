  name: "URL Tags and Badge Single Source"
  problems_solved: "Popup showing no tags when badge correct; add-tag losing prior tags; inconsistent tags shape across pinboard/local/file/sync/browser; popup empty when no Pinboard auth although bookmark in local/file/sync/browser."
  rationale:
    benefits:
      - "Consistent tags shape across pinboard/local/file/sync/browser"
      - "Popup shows tags when bookmark is in non-Pinboard backends without auth"
    problems_solved:
      - "Inconsistent tags shape across providers"
      - "Popup empty when no Pinboard auth although bookmark in local/file/sync/browser"
    why: "Badge and popup must share one normalized bookmark/tag contract across all router backends"
  related:
    - "ARCH-BADGE (badge system)"
    - "ARCH-STORAGE_INDEX_AND_ROUTER (router + five providers)"
  related_decisions:
    depends_on:
