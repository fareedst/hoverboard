ARCH-URL_TAGS_DISPLAY:
  alternatives_considered: []
  benefits: "Normalization at the boundary; all consumers get tags as array and same badge value; popup re-fetches and merges on add/remove; getCurrentBookmark always queries router (no early return for no auth) so popup and badge share same data source; getTagsForUrl message exposes centralized tag storage for tests and UI."
  cross-references: "[REQ-URL_TAGS_DISPLAY](../requirements/REQ-URL_TAGS_DISPLAY.md), [REQ-BADGE_INDICATORS](../requirements/REQ-BADGE_INDICATORS.md), [REQ-PER_BOOKMARK_STORAGE_BACKEND](../requirements/REQ-PER_BOOKMARK_STORAGE_BACKEND.md), [IMPL-URL_TAGS_DISPLAY](../implementation-decisions/IMPL-URL_TAGS_DISPLAY.md)"
  cross_references:
    - "REQ-BADGE_INDICATORS"
    - "REQ-PER_BOOKMARK_STORAGE_BACKEND"
    - "REQ-URL_TAGS_DISPLAY"
  decision: "A single logical module owns tags-for-a-URL and badge display value. Normalization (tags as array, required fields defaulted) happens at the boundary so badge, popup, and overlay consume the same contract. Storage and retrieval remain in BookmarkRouter and its five providers (pinboard|local|file|sync|browser); getBookmarkForUrl uses 2C browser exclusion from the best-of race. This module sits on top and provides display normalization and badge value derivation."
  detail_file: "architecture-decisions/ARCH-URL_TAGS_DISPLAY.yaml"
  implementation_approach:
    details:
      - "Five providers via BookmarkRouter; browser subject to 2C race rule"
      - "No early return when no Pinboard auth — router still queried"
      - "normalizeBookmarkForDisplay / getBadgeDisplayValue single source for badge and popup"
    summary: "URL-tags-manager (normalizeBookmarkForDisplay, getBookmarkForDisplay, getTagsForUrl, getBadgeDisplayValue). handleGetCurrentBookmark always calls router; sets needsAuth when !hasAuth. Popup uses returned bookmark when needsAuth. GET_TAGS_FOR_URL via getTagsForUrl. BadgeManager uses getBadgeDisplayValue. Router and five providers own storage; URL-tags module owns display normalization."
  metadata:
    created:
      author: "MCP converter"
      date: "2026-02-18"
    last_updated:
