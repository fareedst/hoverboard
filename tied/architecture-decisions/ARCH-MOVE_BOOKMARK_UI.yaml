ARCH-MOVE_BOOKMARK_UI:
  alternatives_considered: []
  cross-references: "REQ-MOVE_BOOKMARK_STORAGE_UI, ARCH-STORAGE_INDEX_AND_ROUTER, IMPL-MOVE_BOOKMARK_UI"
  cross_references:
    - "ARCH-STORAGE_INDEX_AND_ROUTER"
    - "IMPL-MOVE_BOOKMARK_UI"
    - "REQ-MOVE_BOOKMARK_STORAGE_UI"
    - "REQ-READ_LATER_BROWSER_FALLBACK"
    - "REQ-STORAGE_MODE_DEFAULT"
  decision: "Popup displays the current storage backend for the current tab's bookmark via five Save to select-one buttons (Pinboard, Local, File, Sync, Browser) and allows the user to move it to another backend. Move is implemented in the router: copy bookmark to target provider, delete from source provider, update storage index. For a new Read Later bookmark only, the controller resolves Browser selection to a metadata-capable backend before save; configured Browser resolves to Local. Existing persisted bookmark updates retain their current path."
  detail_file: "architecture-decisions/ARCH-MOVE_BOOKMARK_UI.yaml"
  implementation_approach:
    details:
      - "MessageHandler already has getStorageBackendForUrl and moveBookmarkToStorage handlers"
      - "Only successful new Read Later saves update Save to and show Browser limitation feedback; archive-status and Offline Reader state remain separate"
      - "Read Later resolves selected Browser through ConfigManager.getStorageMode without provider I/O; metadata-capable backends are pinboard | local | file | sync; configured browser falls back to local"
      - "Read Later uses a persisted-bookmark predicate based on bookmark identity such as time, not currentPin object truthiness"
      - "Save to backends: pinboard | local | file | sync | browser"
      - "When not bookmarked: show default storage or disable"
    summary: "Popup: getStorageBackendForUrl on load; five Save to buttons; on change call moveBookmarkToStorage; ordinary saves send preferredBackend; new Read Later saves resolve Browser selection to pinboard|local|file|sync or local when configured Browser."
  metadata:
    created:
      author: "MCP converter"
      date: "2026-02-18"
    last_updated:
      author: "AI Agent"
      date: "2026-08-02"
      reason: "Define new Read Later metadata backend resolution within shared popup architecture"
    last_validated:
      date: "2026-02-18"
      result: "pass"
      validator: "MCP converter"
  name: "Move Bookmark Storage UI"
  rationale:
    benefits:
      - "Existing bookmark updates and generic create flows remain unchanged"
      - "New Read Later bookmarks retain metadata"
      - "The effective backend is explicit after success"
    problems_solved:
      - "A truthy empty/stub currentPin is treated as persisted"
      - "Browser cannot store toread, shared, or extended metadata required by Read Later"
      - "The UI can claim Browser after a successful Read Later save that was effectively stored elsewhere"
    why: "Preserve the five-backend Save to contract while preventing Browser storage from silently discarding Read Later metadata on new bookmarks."
  related:
