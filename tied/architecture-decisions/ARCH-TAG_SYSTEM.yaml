ARCH-TAG_SYSTEM:
  alternatives_considered:
    - name: "In-memory recent tags only"
      cons:
        - "Lost on worker restart"
        - "Poor cross-window reliability"
      pros:
        - "Simple"
      rejected_reason: "Violates REQ-RECENT_TAGS_SYSTEM persistence and cross-window expectations"
    - name: "Separate idle TTL and tag-age TTL"
      cons:
        - "More config and cognitive load"
      pros:
        - "Finer control"
      rejected_reason: "REQ specifies single N for both rules"
  cross_references:
    - "REQ-RECENT_TAGS_SYSTEM"
    - "REQ-TAG_INPUT_SANITIZATION"
    - "REQ-TAG_MANAGEMENT"
  decision: "Centralize tag sanitization, user-driven recent-tag persistence and time policy in the service worker, expose recent list to UI via TagService and message types; popup refreshes on visibility, side panel refreshes on window focus while Bookmark tab is active."
  detail_file: "architecture-decisions/ARCH-TAG_SYSTEM.yaml"
  implementation_approach:
    details:
      - "Do not treat opening the panel alone as activity; only tag mutations refresh lastActivityAt"
      - "Exclude tags already on current bookmark in UI layer as today"
      - "Sanitize before add/display per REQ-TAG_INPUT_SANITIZATION"
    summary: "TagService sanitizes input. User-recent list lives in RecentTagsMemoryManager in the service worker with chrome.storage.local snapshot (tags + lastActivityAt). On read, apply policy: if now minus lastActivityAt exceeds N minutes, clear; else filter entries by lastUsed within N minutes. Config key recentTagsActivityWindowMinutes (default 15). TagService.getUserRecentTags uses getRecentTagsForUi when available. Mutations (addTagToUserRecentList) update lastActivityAt and persist. MessageHandler routes getRecentBookmarks and addTagToRecent. UI: PopupController visibilitychange loadRecentTags (ARCH-POPUP_SESSION / IMPL-RECENT_TAGS_POPUP_REFRESH); side panel chrome.windows.onFocusChanged plus getCurrent refreshes loadRecentTags when Bookmark tab active (ARCH-SIDE_PANEL_TABS). Browser runtime.onStartup clears persisted user-recent state for a fresh profile session."
  metadata:
    created:
      author: "AI Agent"
      date: "2025-07-14"
    last_updated:
      author: "AI Agent"
      date: "2026-03-28"
      reason: "S05: persistence, N-minute policy, cross-window, UI refresh boundaries"
  name: "Tag System Architecture"
  rationale:
    benefits:
      - "Fast tag reuse"
      - "Predictable N-minute window and idle semantics"
      - "Secure handling"
      - "Single source of truth in background + storage"
    problems_solved:
      - "Cross-window surprise when recent list does not update"
      - "Slow tag entry"
      - "Stale or empty recent tags after SW sleep or when switching browser windows"
      - "XSS via tag strings"
    why: "Tags must be safe, reusable, and consistent across extension contexts; MV3 service workers are ephemeral so user-recent tags need durable storage and explicit refresh triggers in each UI surface."
  related_decisions:
    depends_on: []
    informs:
      - "IMPL-TAG_SYSTEM"
    see_also:
      - "ARCH-MESSAGE_HANDLING"
      - "ARCH-POPUP_SESSION"
      - "ARCH-SIDE_PANEL_TABS"
      - "ARCH-SUGGESTED_TAGS"
  status: "Active"
  traceability:
    code_annotations:
      - "ARCH-TAG_SYSTEM"
    implementation:
      - "IMPL-CONFIG_STRUCT"
      - "IMPL-MESSAGE_HANDLING"
      - "IMPL-RECENT_TAGS_POPUP_REFRESH"
      - "IMPL-SIDE_PANEL_TABS"
      - "IMPL-TAG_SYSTEM"
    requirements:
      - "REQ-RECENT_TAGS_SYSTEM"
      - "REQ-TAG_INPUT_SANITIZATION"
      - "REQ-TAG_MANAGEMENT"
    tests:
      - "tests/unit/message-handler-contracts.test.js"
      - "tests/unit/recent-tags-memory-policy.test.js"
      - "tests/unit/side-panel-tabs.test.js"
      - "tests/unit/tag-recent-behavior.test.js"
  validation_evidence:
    - date: "2026-03-28"
      notes: "S05 ARCH detail + index alignment; unit tests listed in traceability"
      result: "pass"
