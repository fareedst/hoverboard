    - "ARCH-STORAGE_INDEX_AND_ROUTER"
    - "REQ-PER_BOOKMARK_STORAGE_BACKEND"
    - "REQ-STORAGE_MODE_DEFAULT"
  decision: "LocalBookmarkService is one of five BookmarkRouter providers (backend id local), backed by chrome.storage.local. Historically the extension offered only Pinboard vs Local via storageMode; the router and StorageIndex now peer Local with pinboard, file, sync, and browser. MessageHandler still delegates through the active bookmarkProvider (the router). Default storage mode remains local (REQ-STORAGE_MODE_DEFAULT)."
  default: "The default storage mode is **local**. This is preferable for most users: no account or API token is required, and the extension works out of the box. Pinboard remains optional; users who want cloud sync can switch to \"Pinboard (cloud)\" in Options > Storage Mode."
  detail_file: "architecture-decisions/ARCH-LOCAL_STORAGE_PROVIDER.yaml"
  implementation_approach:
    details:
      - "BookmarkRouter delegates by StorageIndex / preferredBackend / defaultStorageMode"
      - "Default storageMode is local (REQ-STORAGE_MODE_DEFAULT)"
      - "Historical note: early strategy pattern was Pinboard|Local only; superseded by five-provider router"
      - "LocalBookmarkService: same contract as other providers; chrome.storage.local key for bookmarks"
    summary: "LocalBookmarkService implements the provider contract on chrome.storage.local. BookmarkRouter holds it alongside pinboard/file/sync/browser. ConfigManager storageMode default local; Options Storage Mode selects default among five backends."
  messagehandler: "Constructor accepts `bookmarkProvider`; all bookmark operations use `this.bookmarkProvider`; `setBookmarkProvider(provider)` for runtime swap."
