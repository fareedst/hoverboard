CITDP-REQ-LOCAL_BOOKMARKS_INDEX-store-load-retry:
  change_definition:
    current_behavior: "Stores default unchecked (required). First getAggregatedBookmarksForIndex can leave allBookmarks empty (error+[] treated as success); store checkbox change only refilters, so checking L/F/S shows No local, file, or sync bookmarks until full page reload."
    desired_behavior: "Stores stay default-unchecked. Aggregate error or success:false triggers local fallback even when bookmarks is []. Checking a store when allBookmarks is empty re-runs LOAD_LOCAL_BOOKMARKS_INDEX. SW provider init is serialized for concurrent cold-start messages."
    non_goals:
      - "Default-checking any Stores checkbox (REQ UX unchanged)"
      - "New REQ token"
      - "Pinboard in the index"
    success_criteria:
      - "Cold open → check Local → rows appear without reload when data exists"
      - "Store change with populated allBookmarks does not refetch"
      - "Stores still start unchecked"
      - "{ bookmarks: [], error } triggers local fallback"
    unchanged_behavior: "Stores default all unchecked; matchStoresFilter empty set shows no rows; filter pipeline otherwise unchanged."
  completion_criteria:
