    risk_analysis:
      risks:
        - id: "RISK-001"
          description: "Large or sensitive page content can exceed browser/file quotas or capture private data."
          mitigation: "Local/File only, explicit capture, bounded artifacts, inhibit handling, and observable failure without partial commit."
          residual: "medium"
          severity: "high"
        - id: "RISK-002"
          description: "Archived HTML can execute unsafe scripts or link to unsafe content."
          mitigation: "Sanitize at capture boundary and render only sanitized content in constrained Reader page."
          residual: "low"
          severity: "high"
        - id: "RISK-003"
          description: "Archive search can drift from lifecycle state."
          mitigation: "Replace/remove index entries in the same successful archive lifecycle and test recapture/deletion."
          residual: "low"
          severity: "medium"
        - id: "RISK-004"
          description: "Product screenshot implementation could accidentally change documentation screenshot mode."
          mitigation: "Use dedicated modules/messages and preserve IMPL-SCREENSHOT_MODE files and tests."
          residual: "low"
          severity: "medium"
    success_criteria:
