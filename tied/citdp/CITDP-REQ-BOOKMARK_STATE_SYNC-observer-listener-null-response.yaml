CITDP-REQ-BOOKMARK_STATE_SYNC-observer-listener-null-response:
  CITDP-REQ-BOOKMARK_STATE_SYNC-observer-listener-null-response:
    change_definition:
      current_behavior: "PopupController registers two chrome.runtime.onMessage listeners as async arrow functions that only act on BOOKMARK_UPDATED. From Chrome 144 a listener returning a promise is treated as answering the message; an async listener with no return implicitly resolves undefined and Chrome sends null to the sender. With popup or side panel open, that null wins the race against the service worker reply for content-script messages (getTabId, getOptions, getCurrentBookmark), so content-main throws 'Cannot read properties of null (reading success)' and page data, config, and tabId are lost on the active tab."
      desired_behavior: "Observer listeners are synchronous: they filter by message type, run refresh work in a detached promise, and return undefined so they never claim the response channel. Callers of runtime messaging treat null or undefined as a missing response via shared unwrapMessageResponse/readMessageResponse, record a messageResponseMissing inspector action, and fall back to defaults instead of throwing."
      non_goals:
        - "Change MessageService content-side listener that returns true"
        - "Chrome version detection or feature probing"
        - "Remove duplicate BOOKMARK_UPDATED refresh paths in PopupController"
        - "Rewrite MessageClient retry or timeout policy"
      success_criteria:
        - "tied_validate_consistency ok"
        - "Unit: BOOKMARK_UPDATED still triggers refresh after the sync listener returns"
        - "Unit: both observer paths (applyExternalBookmarkUpdate and refreshOnExternalBookmarkUpdate) covered"
        - "Unit: content-script tabId/config/page-data paths tolerate a null reply, keep defaults, and record messageResponseMissing"
        - "Unit: every PopupController runtime.onMessage listener returns undefined (never a promise) for unrelated message types"
        - "Unit: unwrapMessageResponse maps null/undefined to null and unwraps { success, data } and plain payloads"
      unchanged_behavior: "BOOKMARK_UPDATED still refreshes popup and side panel state; service worker response shapes unchanged; content-script message contract unchanged."
    completion_criteria:
      verification_gate_notes: "Unit suites green (listener contract, unwrap, content-message-response-missing); CHANGELOG Unreleased Fixed entry; tied_validate_consistency; no Web Store E2E required for this stream."
    impact_analysis:
      modules_or_boundaries: "src/ui/popup/PopupController.js (constructor observer listener, setupRealTimeUpdates); new src/shared/message-response.js; src/features/content/content-main.js (initializeTabId, loadConfiguration, loadCurrentPageData, getOptions); src/shared/ui-inspector.js messageResponseMissing action; vocab ipc-messaging."
      tied_tokens_affected:
