  risk_analysis:
    method: "Assess compatibility, stale count metadata, provider-row identity, filter-order regressions, accessibility, and generated-output drift."
    risks:
      - id: "RISK-HEALTH-001"
        likelihood: "medium"
        mitigation: "Use nullish/own-property-aware defaulting; preserve stored false; test absent/false/true."
        residual: "low"
        risk: "Absent-setting semantics could accidentally overwrite an explicit false."
        severity: "high"
      - id: "RISK-INDEX-001"
        likelihood: "medium"
        mitigation: "Derive metadata-filtered rows first, calculate counts, then apply Stores only for rendering."
        residual: "low"
        risk: "Applying Stores before counts would make unchecked controls show zero or stale counts."
        severity: "high"
      - id: "RISK-INDEX-002"
        likelihood: "medium"
        mitigation: "Normalize known values case-insensitively; exclude unknown from named Stores and test fallback separately."
        residual: "low"
        risk: "Unknown or missing storage values disappear from counts or are mislabelled."
        severity: "medium"
      - id: "RISK-INDEX-003"
        likelihood: "medium"
        mitigation: "Count rows directly; never use URL Set for Store counts."
        residual: "low"
        risk: "Duplicate URLs are incorrectly deduplicated."
        severity: "medium"
      - id: "RISK-INDEX-004"
        likelihood: "medium"
        mitigation: "Use compact inline text with responsive wrapping and preserve focus-visible styles."
        residual: "low"
        risk: "Count DOM updates make Store controls unusable on narrow screens."
        severity: "low"
  tdd_sequence:
    composition:
