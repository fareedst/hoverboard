CITDP-REQ-HEALTH_STORE_COUNTS_20260802:
  change_definition:
    current_behavior: "linkHealthChecksEnabled defaults false when absent; Stores default unchecked; the Index applies the Stores filter before metadata filters and has no per-store count controls."
    desired_behavior: "An absent linkHealthChecksEnabled setting is effectively enabled, explicit false remains disabled, and no automatic CHECK_LINK_HEALTH dispatch is introduced. Stores L/F/S/B start checked. Each Store control shows filtered / total loaded provider-row counts, with filtered calculated after search, Show only, Hide, and Health but before Stores selection; counts remain informative when unchecked."
    in_scope:
      - "ConfigManager effective default, Options copy/load/save semantics, and manual-only link-health dispatch boundary."
      - "Local Bookmarks Index Store checkbox markup/defaults, pure per-store count helper, metadata-before-Store filter composition, count refresh and styling."
      - "REQ/ARCH/IMPL and pseudo-code updates, vocabulary, unit/composition/UI tests, generated dist, changelog, and TIED validation."
    non_goals:
      - "Changing explicit stored false to true."
      - "Changing link-health request/response protocol."
      - "Removing the prior store-load-retry CITDP; it remains historical evidence."
    out_of_scope:
      - "Automatic install-time or page-load network checks."
      - "Counts for Archived or All resources scopes when provider-row metadata is not applicable."
      - "New semantic tokens unless existing tokens cannot express the behavior."
      - "Unique-URL deduplication for Store counts."
    success_criteria:
      - "All four Stores are checked in initial Index markup."
      - "Counts refresh after load, search, Show only, Hide, Health, and Store changes without unnecessary reloads."
      - "Counts report total rows by normalized storage and filtered rows after non-Store filters, including duplicates and Local fallback rows."
      - "Missing linkHealthChecksEnabled resolves to true; explicit false resolves to false; explicit true resolves to true."
      - "No CHECK_LINK_HEALTH message is dispatched merely by enabling or loading the UI."
  impact_analysis:
    tied_tokens_affected:
