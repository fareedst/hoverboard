CITDP-REQ-LOCAL_BOOKMARKS_INDEX-dismiss-side-panel-on-open:
  change_definition:
    current_behavior: "Opening Local Bookmarks Index via popup, command, or context menu creates a tab only; Chrome keeps an already-open side panel visible beside the new tab."
    desired_behavior: "On index tab create (popup OPEN_BOOKMARKS_INDEX, command open-bookmarks-index, context menu hoverboard-open-bookmarks-index), SW OPEN_BOOKMARKS_INDEX_TAB creates the tab then broadcasts REQUEST_SIDE_PANEL_CLOSE. Index page refresh does not re-dismiss. Toolbar icon may reopen the side panel. Options href open unchanged (no dismiss)."
    non_goals:
      - "chrome.sidePanel.close API (does not exist)"
      - "Close on index page load/refresh"
      - "New REQ satellite token"
      - "Options page href dismiss"
    success_criteria:
      - "bookmarks-table.js does not send REQUEST_SIDE_PANEL_CLOSE"
      - "Command/menu/message create index URL and send REQUEST_SIDE_PANEL_CLOSE"
      - "Icon toggle close still works"
      - "Popup sends OPEN_BOOKMARKS_INDEX not direct tabs.create"
    unchanged_behavior: "Icon click open/toggle; side panel 300ms guard; options bookmarks-index link href"
  completion_criteria:
    verification_gate_notes: "service-worker-open-bookmarks-index unit tests pass; icon-toggle and quick-access tests pass; tied_validate_consistency ok."
  impact_analysis:
    modules_or_boundaries: "service-worker _openBookmarksIndexTab; message-handler OPEN_BOOKMARKS_INDEX; PopupController.handleOpenBookmarksIndex; ui-action-contract mapping; IMPL-LOCAL_BOOKMARKS_INDEX pseudocode; vocab bookmarks-index/side-panel/ui-surfaces/ipc-messaging."
