      - "tied/vocab/page-archives.md"
      - "tied/vocab/routing.md"
    verification_gate_notes: "Full Jest passed 1,598 tests with 1 skipped across 158 suites. Targeted archive unit/composition coverage passed 51/51. Archive extension Playwright passed 8/8 using playwright.extension.config.js. npm run build:only, npm run lint, npm run typecheck, scripts/validate_tokens.sh, npm run validate:manifest, yaml_index_validate, and tied_validate_consistency all passed. npm run validate:manifest reported only the existing sessions permission compatibility warning. lint_yaml is not present in this client checkout and is not exposed by the available TIED MCP server; index and full consistency validation supplied the available YAML gate."
  impact_analysis:
