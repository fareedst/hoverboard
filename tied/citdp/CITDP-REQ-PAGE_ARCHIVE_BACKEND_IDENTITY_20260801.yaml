CITDP-REQ-PAGE_ARCHIVE_BACKEND_IDENTITY_20260801:
  change_definition:
    current_behavior: "Archive search, cleanup, and Offline Reader navigation could resolve same-URL Local and File artifacts through URL-only identity, and Reader lookup failures could collapse into a generic missing state."
    desired_behavior: "Use backend-scoped archive identity consisting of selected backend, normalized URL, and optional archiveId across archive search, cleanup, Reader targets, and Reader lookup; preserve stable Reader error states."
    non_goals:
      - "Adding a dedicated Playwright case for same-URL backend collision when unit and composition coverage prove the binding"
      - "Adding archive support for Pinboard, Sync, or Browser storage backends"
      - "Changing metadata search semantics or Local Query API archive exposure"
      - "Changing source presentation profile behavior already covered by CITDP-OFFLINE_READER_SOURCE_PRESENTATION_20260801"
    success_criteria:
      - "Reader preserves MissingArchive, UnsupportedBackend, StorageFailed, and InvalidArchive outcomes accessibly"
      - "Reader targets and lookup requests carry backend and archiveId when available"
      - "Same-URL Local and File archives remain separate in derived archive search and cleanup"
      - "Unit, composition, and extension E2E coverage passes"
    unchanged_behavior: "Metadata search remains unchanged; archive support remains limited to Local and File; source presentation profile behavior remains bounded and fallback-safe; screenshot artifacts remain separate."
  completion_criteria:
    docs_updated:
