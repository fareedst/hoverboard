      impl_inventory_notes: "Association orchestrator, PageArchiveStore compensation seams, selected-backend BookmarkRouter lookup, MessageHandler/service worker wiring, PopupController/UIManager feedback, and archive E2E path were implemented over the existing Local/File archive foundation."
