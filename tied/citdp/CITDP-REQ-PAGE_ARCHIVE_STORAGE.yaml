        association: "Selected-backend lookup, stub preservation, recapture, bookmark-save compensation, and cleanup diagnostics are covered by tests/unit/page-archive-bookmark-association.test.js and tests/unit/page-archive-store.test.js."
        composition: "Message dispatch and adapter lifecycle are covered by tests/integration/page-archive-bookmark-association-message-dispatch-composition.integration.test.js and tests/unit/message-handler-archive.test.js; popup action binding, service-worker runtime listener, and archive-scope isolation are covered by tests/integration/popup-archive-actions-composition.integration.test.js, tests/integration/service-worker-archive-dispatch-composition.integration.test.js, and tests/integration/bookmarks-table-archive-scope-composition.integration.test.js."
