  status: "Implemented"
  summary: "The badge and popup (and overlay) must show the same tag count and tag list for a given URL. A single logical source provides the list of tags for a URL and the value the badge displays; normalization (e.g. tags as array) is guaranteed for all consumers so the popup never shows no tags when the badge shows the correct count, and adding a tag never overwrites prior tags."
