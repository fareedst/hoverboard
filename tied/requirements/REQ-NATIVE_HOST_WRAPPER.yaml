      - "IMPL-NATIVE_HOST_INSTALLER"
      - "IMPL-NATIVE_HOST_WRAPPER"
    tests:
      - "tests/unit/native-host-ping.test.js"
  validation_criteria:
    - method: "Manual: Run installer, load extension, send ping; receive pong or echo."
    - method: "Unit tests (optional): Wrapper protocol encode/decode; install-dir resolution."
