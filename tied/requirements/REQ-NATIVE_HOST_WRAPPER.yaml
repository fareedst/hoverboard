REQ-NATIVE_HOST_WRAPPER:
  architecture: "[ARCH-NATIVE_HOST](architecture-decisions/ARCH-NATIVE_HOST.md)"
  category: "Functional"
  description: "The extension may communicate with a **native messaging host** launched by Chrome. The native host must be a **thin wrapper** that:\n\n- Is started by Chrome from a path specified in the native messaging manifest (e.g. `~/.hoverboard/native_host` or `C:\\...\\native_host.exe`).\n- Does **not** run or load code from the extension’s install directory (the extension cannot expose that path and Chrome does not pass it to the host).\n- Calls **helper** code (logic, libs, scripts) that was **distributed with the extension** but **installed next to the wrapper** by a one-time installer. The wrapper resolves its own install directory (e.g. from the executable path) and loads/runs only from that directory (or another known path)."
  detail_file: "requirements/REQ-NATIVE_HOST_WRAPPER.yaml"
  implementation: "[IMPL-NATIVE_HOST_WRAPPER](implementation-decisions/IMPL-NATIVE_HOST_WRAPPER.md), [IMPL-NATIVE_HOST_INSTALLER](implementation-decisions/IMPL-NATIVE_HOST_INSTALLER.md)"
  metadata:
    created:
      author: "MCP converter"
      date: "2026-02-18"
    last_updated:
      author: "AI Agent"
      date: "2026-07-29"
      reason: "Corpus remediation Phase 2: add native-host-ping tests to traceability"
    last_validated:
      date: "2026-02-18"
      result: "pass"
      validator: "MCP converter"
  name: "Native Host Wrapper Requirement"
  priority: "P1"
  rationale:
    benefits: []
    problems_solved: []
    why: "Chrome starts the host process from a fixed path in the manifest; the host has no way to discover the extension’s filesystem path.\nTo still use “extension-distributed” logic, that logic must be copied to a fixed location (e.g. `~/.hoverboard/` or `%LOCALAPPDATA%\\Hoverboard\\`) by an installer; the wrapper then invokes it from its own install directory."
  related_requirements:
    depends_on: []
    related_to: []
    supersedes: []
  satisfaction_criteria:
    - criterion: "A native host binary (wrapper) implements the Chrome native messaging protocol (stdio, length-prefixed JSON)."
    - criterion: "An installer script (macOS/Linux and Windows) copies wrapper and helper from a source directory to a fixed install path and writes the native messaging manifest (and on Windows, the registry key) so Chrome can start the host."
    - criterion: "The extension has the `nativeMessaging` permission and can optionally test connectivity (e.g. ping) from the options page or service worker."
    - criterion: "The wrapper delegates to a helper (script or binary) in the same directory when present; otherwise responds with a safe fallback (e.g. ping → pong, or echo)."
    - criterion: "The wrapper resolves its install directory from its executable path and does not depend on any path from the extension."
  status: "Implemented"
  traceability:
    architecture:
      - "ARCH-NATIVE_HOST"
    code_annotations:
