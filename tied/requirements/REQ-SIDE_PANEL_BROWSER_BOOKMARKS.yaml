REQ-SIDE_PANEL_BROWSER_BOOKMARKS:
  category: "Functional"
  description: "Standalone Browser Bookmarks page (browser-bookmarks.html) manages the Chrome bookmark tree UI (chrome.bookmarks.getTree): search, folders, bulk open/move/delete, import/export HTML/CSV. Legacy token name keeps SIDE_PANEL_; behavior is not a side-panel tab. Distinct from REQ-BROWSER_BOOKMARK_STORAGE (BookmarkRouter Store B)."
  metadata:
    created:
      author: "AI Agent"
      date: "2026-03-02"
    last_updated:
      author: "AI Agent"
      date: "2026-07-31"
      reason: "LEAP: Browser Bookmarks is standalone page, not side-panel tab"
    last_validated:
      date: "2026-03-02"
      result: "pass"
      validator: "AI Agent"
  name: "Side Panel Browser Bookmarks"
  priority: "P1"
  rationale:
    benefits:
      - "Standalone Browser Bookmarks page; list all Chrome bookmarks with folder path, favicon; real-time search; folder filter; sort; bulk open/move/delete/copy; undo delete; import/export HTML and CSV"
    problems_solved:
      - "No quick search or bulk management of browser bookmarks"
      - "Page-bound side panel is the wrong surface for tab-independent Chrome tree UX"
    why: "Let users manage Chrome browser bookmarks from a dedicated full-page tool with search, folder navigation, sorting, bulk operations, and import/export."
  related_requirements:
    depends_on: []
    related_to:
      - "REQ-BROWSER_BOOKMARK_STORAGE"
      - "REQ-SIDE_PANEL_POPUP_EQUIVALENT"
    supersedes: []
  satisfaction_criteria:
    - criterion: "Boundary: this REQ is Chrome-tree UI on the Browser Bookmarks page; REQ-BROWSER_BOOKMARK_STORAGE is BookmarkRouter backend browser (Store B), not this page"
    - criterion: "Bulk checkbox per row; Select all / Deselect all; Open in tabs/window; Copy URLs; Move to folder; Delete with confirmation; Export selected or all as HTML/CSV"
    - criterion: "Click bookmark URL opens in new tab via chrome.tabs.create"
    - criterion: "Folder sidebar or dropdown shows folder tree with bookmark counts; click folder filters list to that folder"
    - criterion: "Import HTML (Netscape) or CSV into selected folder; conflict resolution (skip duplicates or overwrite); progress indicator"
    - criterion: "Inline edit double-click title or URL; chrome.bookmarks.update"
    - criterion: "Keyboard Ctrl+F focus search, Escape clear selection"
    - criterion: "List shows title, URL, favicon, folder path for each bookmark"
    - criterion: "Manifest command open-side-panel-browser-bookmarks opens standalone browser-bookmarks.html (legacy command id)"
    - criterion: "Real-time search (case-insensitive substring) across title, URL, folder path; match count displayed"
    - criterion: "Session-scoped undo stack; Deleted N bookmarks. Undo with timed dismiss; undo restores via chrome.bookmarks.create"
    - criterion: "Sort by Date (newest/oldest), Name (A-Z/Z-A), Chrome default order; preference persisted in chrome.storage.local"
    - criterion: "Standalone page displays Chrome browser bookmarks from chrome.bookmarks.getTree; side panel has no Bookmarks tab"
  status: "Implemented"
  traceability:
    architecture:
      - "ARCH-SIDE_PANEL_BROWSER_BOOKMARKS"
    code_annotations:
      - "REQ-SIDE_PANEL_BROWSER_BOOKMARKS"
    implementation:
      - "IMPL-SIDE_PANEL_BROWSER_BOOKMARKS"
    tests:
