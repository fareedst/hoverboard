  name: "Local Bookmarks Index Import"
  priority: "P1"
  rationale:
    benefits:
      - "Import a selected live Browser bookmark tree into Local | File | Sync without an export-and-reimport step, with folder-to-tag mapping and target-specific conflicts"
      - "Import to Local | File | Sync | Browser from rich CSV/JSON files, preserving Hoverboard fields"
    problems_solved:
      - "No way to bring in bookmarks from external CSV/JSON files (e.g. from another tool or backup)"
      - "No way to restore or merge previously exported bookmark data into the index"
    why: "Allow users to import bookmarks from a file (CSV or JSON) into the index storage (Local | File | Sync | Browser) with control over duplicates."
  related_requirements:
    depends_on: []
    related_to:
      - "REQ-LOCAL_BOOKMARKS_INDEX"
      - "REQ-LOCAL_BOOKMARKS_INDEX_EXPORT"
    supersedes: []
  satisfaction_criteria:
    - "Import source can be File (CSV/JSON) or live Browser bookmarks; the existing file import behavior remains unchanged."
    - "Live Browser source excludes Browser as a destination while file import retains Local | File | Sync | Browser targets."
    - "Live Browser source supports title/URL/folder search, folder filtering, selection, Skip/Overwrite/Merge tags, folder tags, extra tags, and imported/skipped/failed results."
  status: "Implemented"
  summary: "The Local Bookmarks Index Import control supports rich CSV/JSON files and a live Browser bookmark source. Live source import targets Local|File|Sync with selective folder/tag migration and target-specific conflict handling; file import retains Browser as a target."
  traceability:
