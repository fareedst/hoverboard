  satisfaction_criteria:
    - criterion: "Actions contains Refresh API snapshot and Check link health; Import remains a dedicated group; Export is a sibling dedicated group with all, displayed, and selected scopes."
    - criterion: "Canonical Local Bookmarks Index and interchange terms remain defined in tied/vocab/bookmarks-index.md."
    - criterion: "Dedicated extension page displays table with search (title/URL/tags/notes), filters (tag, toread, shared), Stores L/F/S/B, sortable columns including Storage (Local | File | Sync | Browser), default time desc, URL as link."
    - criterion: "Entry point from popup and/or options opens the Local Bookmarks Index page in a new tab."
    - criterion: "Existing filter semantics, import/export behavior, result announcements, snapshot behavior, link-health gating, and control IDs remain unchanged."
    - criterion: "Primary data uses getAggregatedBookmarksForIndex for local + file + sync + browser bookmarks with storage fields, with getLocalBookmarksForIndex as the LocalBookmarkService fallback."
    - criterion: "The bookmark list occupies the remaining viewport without being obscured by the fixed head or footer panels; the table header remains positioned below the head panel when sticky."
    - criterion: "The fixed footer control panel preserves form values while switching or collapsing, keeps Actions as the sole footer keyboard entry tab when collapsed, and retains focus on the activated tab."
    - criterion: "The fixed footer control panel recalculates --index-footer-sticky-height after initialization and every transition; ?source=browser intentionally opens the Import group."
    - criterion: "The Local Bookmarks Index has a fixed footer control panel with accessible Actions, Import, and Export tabs; normal loads start with no visible footer group, selecting an inactive tab exposes only its group, and activating the current tab collapses the footer."
    - criterion: "The Local Bookmarks Index has a fixed head control panel with accessible tabs for Stores (L / F / S / B), Show only, Hide, and Table Display; exactly one head group is visible at a time."
  status: "Implemented"
  summary: "Dedicated Local Bookmarks Index with aggregated Local/File/Sync/Browser rows, checked Stores defaults, and a collapsible fixed footer control panel."
  table_page: "The Local Bookmarks Index is a full-page table with a fixed head control panel and fixed footer control panel surrounding the bookmark-list viewport. The head tablist exposes Stores (L/F/S/B), Show only, Hide, and Table Display; exactly one head fieldset is visible at a time and Stores is the default. The footer tablist exposes Actions, Import, and Export; normal loads start collapsed with all footer panels hidden and no selected footer tab, while Actions is the sole keyboard entry with tabindex 0. Activating an inactive footer tab opens exactly that group; activating the active tab collapses the footer without recreating controls or losing form values. The bookmark list provides Search, sortable Title/URL/Tags/Time/Storage/Shared/To read columns, selection, launchable URL links, and existing filter semantics. The fixed head and footer heights are measured into CSS variables; the table header is offset below the head panel only after the list scrolls beneath it, and list spacing prevents either fixed panel from obscuring rows. The bookmark count remains visible at the bottom of the page."
