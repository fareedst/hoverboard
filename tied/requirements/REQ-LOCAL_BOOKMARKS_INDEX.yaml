  satisfaction_criteria:
    - criterion: "Actions contains Refresh API snapshot and Check link health; Import remains a dedicated group; Export is a sibling dedicated group with all, displayed, and selected scopes."
    - criterion: "Bulk Delete confirms selected records, sends preferredBackend from the Storage column, announces pending/final #delete-result status, refreshes the table, and clears selection."
    - criterion: "Canonical Local Bookmarks Index and interchange terms remain defined in tied/vocab/bookmarks-index.md."
    - criterion: "Checking a Stores checkbox when allBookmarks is empty and at least one store is checked re-runs LOAD_LOCAL_BOOKMARKS_INDEX without a full page reload; Stores default checked."
    - criterion: "Dedicated extension page displays the Local Bookmarks Index with search, Stores L/F/S/B, Show only/Hide filters, sortable columns including Storage, and launchable URL links."
    - criterion: "Each Local/File/Sync/Browser Stores control displays filtered / total loaded provider-row counts after search, Show only, Hide, and Health filters but before store selection; counts include duplicate rows and remain visible when a store is unchecked."
    - criterion: "Existing filter semantics, import/export behavior, result announcements, snapshot behavior, link-health gating, and control IDs remain unchanged."
    - criterion: "Opening the Local Bookmarks Index through popup, command, or context menu sends REQUEST_SIDE_PANEL_CLOSE after tab creation; index page initialization does not send that message."
    - criterion: "Primary data uses getAggregatedBookmarksForIndex for local, file, sync, and browser bookmarks with storage fields, with getLocalBookmarksForIndex as the LocalBookmarkService fallback."
    - criterion: "The bookmark list occupies the remaining viewport without being obscured by the fixed head or footer panels; the table header remains positioned below the head panel when sticky."
    - criterion: "The Local Bookmarks Index has a fixed footer with accessible Actions, Import, and Export tabs; exactly one footer group is visible at a time and Actions is the default."
    - criterion: "The Local Bookmarks Index has a fixed head control panel with accessible tabs for Stores (L / F / S / B), Show only, Hide, and Table Display; exactly one head group is visible at a time."
  status: "Implemented"
  summary: "A dedicated Local Bookmarks Index page shows local, file, sync, and browser bookmarks. A fixed head control panel switches between Stores (L/F/S/B), Show only, Hide, and Table Display; a fixed footer switches between Actions, Import, and Export while the bookmark list occupies the remaining viewport. Existing filtering, selection, move, delete, import, export, snapshot, and link-health behavior is preserved."
  table_page: "The Local Bookmarks Index is a full-page table with a fixed head control panel and fixed footer control panel surrounding the bookmark-list viewport. The head tablist exposes Stores (L/F/S/B), Show only, Hide, and Table Display; exactly one head fieldset is visible at a time and Stores is the default. The footer tablist exposes Actions, Import, and Export; exactly one footer fieldset is visible at a time and Actions is the default. Stores default unchecked. The bookmark list provides Search, sortable Title/URL/Tags/Time/Storage/Shared/To read columns, selection, launchable URL links, and existing filter semantics. Actions retains snapshot, link-health, move, and delete behavior; Import and Export retain their existing scopes and conflict controls. The fixed head and footer heights are measured into CSS variables; the table header is offset below the head panel only after the list scrolls beneath it, and list spacing prevents either fixed panel from obscuring rows. The bookmark count remains visible at the bottom of the page."
