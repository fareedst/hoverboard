  name: "Local Bookmarks Index Page"
  priority: "P1"
  purpose:
    - "Allow bulk delete of selected bookmarks from the index (confirmation with count and optionally titles; preferredBackend from Storage column; `#delete-result` pending/final)."
    - "Allow bulk move of selected bookmarks to another storage (Local | File | Sync) via [REQ-MOVE_BOOKMARK_STORAGE_UI]."
    - "Give users a single place to browse and search all non-Pinboard bookmarks (local + file + sync)."
    - "Show where each bookmark is stored (Local | File | Sync) via a Storage column."
    - "Support finding and opening bookmarks without leaving the extension."
    - "The bookmark count (# bookmarks) must always appear at the bottom of the page: last in document order; when content is shorter than the viewport, at the visual bottom of the viewport; when content is long, the count bar stays visible (sticky to the viewport bottom) when scrolling."
