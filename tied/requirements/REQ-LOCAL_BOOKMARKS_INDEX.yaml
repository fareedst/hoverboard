  name: "Local Bookmarks Index Page"
  priority: "P1"
  purpose:
    - "Allow bulk delete of selected bookmarks from the index (confirmation with count and optionally titles; preferredBackend from Storage column; #delete-result pending/final)."
    - "Allow bulk move of selected bookmarks to another storage (Local | File | Sync | Browser) via REQ-MOVE_BOOKMARK_STORAGE_UI."
    - "Each Stores control shows filtered / total provider-row counts. Total is all loaded rows for that store; filtered applies search, Show only, Hide, and Health before the Stores checkbox filter. Counts remain informative when a store is unchecked."
    - "Give users a single place to browse and search all non-Pinboard bookmarks (local + file + sync + browser)."
    - "Recover from a failed or empty first index fetch when the user checks a store: re-run load without a full page reload (store-change reload). Stores default checked."
    - "Show where each bookmark is stored (Local | File | Sync | Browser) via a Storage column."
    - "Support finding and opening bookmarks without leaving the extension."
    - "The bookmark count (# bookmarks) must always appear at the bottom of the page."
    - "When the Local Bookmarks Index tab is created via popup/command/context menu, dismiss any already-open side panel."
