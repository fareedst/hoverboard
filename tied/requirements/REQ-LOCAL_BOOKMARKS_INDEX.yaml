REQ-LOCAL_BOOKMARKS_INDEX:
  backend: "Primary data via message getAggregatedBookmarksForIndex (BookmarkRouter aggregates LocalBookmarkService + FileBookmarkService + SyncBookmarkService + BrowserBookmarkService, each item tagged with storage local|file|sync|browser). Fallback: getLocalBookmarksForIndex uses LocalBookmarkService only."
  category: "Functional"
  cross-references: "ARCH-LOCAL_BOOKMARKS_INDEX, IMPL-LOCAL_BOOKMARKS_INDEX, ARCH-STORAGE_INDEX_AND_ROUTER"
  detail_file: "requirements/REQ-LOCAL_BOOKMARKS_INDEX.yaml"
  entry_point: "Popup, extension command open-bookmarks-index, and context menu hoverboard-open-bookmarks-index open the index via SW OPEN_BOOKMARKS_INDEX / OPEN_BOOKMARKS_INDEX_TAB (tabs.create then REQUEST_SIDE_PANEL_CLOSE so an already-open side panel is dismissed). Options page may still link via href (no dismiss). Toolbar icon may reopen the side panel after the index is open [REQ-ICON_CLICK_BEHAVIOR]."
  how_validated:
    - "Composition/static: bookmarks-table-index.test.js verifies head/footer tab counts, default visibility, control placement, sticky positioning declarations, and viewport-safe CSS variables; bookmarks-table-controls.test.js verifies independent control-region state and invalid-group rejection."
    - "Composition: runBulkDelete pending/final + preferredBackend sendMessage (bookmarks-table-bulk-delete-composition.integration.test.js); MessageHandler→Router→File preferredBackend delete (message-handler-router-storage.integration.test.js)."
    - "Manual: Confirm the bookmark list occupies the space between fixed head and footer panels, table headings remain below the head panel after the list scrolls beneath it, and rows are not obscured by either panel."
    - "Manual: Open index page; Stores – no bookmarks until at least one store (Local/File/Sync/Browser) checked; Show only (tags include, to-read, private, time range); Hide (tags exclude); confirm filtered list and sort; click URL to open in new tab (external-link indicator)."
    - "Manual: Open the Local Bookmarks Index and confirm the footer starts collapsed with no selected footer tab and all footer panels hidden; activate Actions, Import, and Export; confirm exactly one selected tab and one visible panel when expanded; activate the current tab again to collapse; confirm Stores remains the head default."
    - "Manual: Select column and select-all; Move selected to (Local | File | Sync | Browser); Delete selected – confirmation shows count and names when ≤8; after confirm, #delete-result shows Deleting… then Deleted N…; bookmarks removed and table refreshed."
    - "Manual: Show only Clear button resets Tags, To read only, Private only, Time range, and Time Field to defaults; Table Display group contains Time column and Time format."
    - "Manual: Time column toggle (Create time | Last updated) and Time format (Absolute | Age); single Time column shows chosen value and format; sort by Time uses selected time source."
    - "Manual: Use ArrowLeft, ArrowRight, Home, and End on each control tab; confirm roving focus and aria-selected state follow the active tab without losing form values."
    - "Unit tests (bookmarks-table-index.test.js): bookmark count/footer-spacer/footer-info layout, fixed head/footer markup, sticky CSS variables, matchStorageFilter, matchStoresFilter (including Browser B), inTimeRange, matchExcludeTags, buildDeleteConfirmMessage, buildDeletePayload, and #delete-result; formatTimeAbsolute and formatTimeAge remain covered by bookmarks-table-time.test.js."
    - "Unit tests: isAggregatedIndexLoadFailure, shouldReloadBookmarksOnStoreChange, onStoreFilterChange, createProviderInitMutex (bookmarks-table-load.test.js)."
    - "Unit tests: OPEN_BOOKMARKS_INDEX_TAB create + REQUEST_SIDE_PANEL_CLOSE; popup sends OPEN_BOOKMARKS_INDEX; bookmarks-table.js must not send close (service-worker-open-bookmarks-index.test.js)."
