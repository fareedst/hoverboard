  status: "Implemented"
  summary: "A dedicated extension page shows local, file, sync, and browser bookmarks. Stores: Local (L), File (F), Sync (S), Browser (B); default all unchecked. Storage column and Move/Import targets include Browser. Pinboard stays out of index aggregation."
  table_page: "Search (single input). **Stores** group: checkboxes Local (L), File (F), Sync (S); default all unchecked so no bookmarks displayed until at least one store is selected; store checkboxes control which backends are included. **Show only** group: Tags (comma-separated, include), To read only, Private only, Time range (Start/End date-time, Time field: Create time | Last updated), **Clear** button to reset this group to defaults. **Table Display** group: **Time column** (Create time | Last updated) and **Time format** (Absolute | Age) toggles that modify the table. **Hide** group: Tags (comma-separated, exclude). **Select** column (checkboxes, select-all); sortable columns (Title, URL, Tags, Time, Storage, Shared, To read); URL column as links with **external-link indicator**. **Sticky behavior**: When the user scrolls past the Table Display section, the **Table Display** block and the **table column headers** remain at the top of the viewport; the table body scrolls below them. The **bookmark count** (# bookmarks) is sticky to the bottom of the viewport so it stays visible when scrolling long content; when content is short, a spacer pushes it to the visual bottom. **Actions for selected** (below table) scroll with the content. **Actions for selected**: Export all / Export displayed / Export selected, Move selected to (dropdown + Move), **Delete** (confirmation with count and names if ≤8; `#delete-result` pending/final; preferredBackend from Storage column) [REQ-LOCAL_BOOKMARKS_INDEX] [REQ-MOVE_BOOKMARK_STORAGE_UI]. **Import** is a sibling control group [REQ-LOCAL_BOOKMARKS_INDEX_IMPORT]. Page layout is **compact** (reduced whitespace around and inside control groups) to give maximum space to the table."
