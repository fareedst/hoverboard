REQ-LOCAL_BOOKMARKS_INDEX:
  backend: "Primary data via message getAggregatedBookmarksForIndex (BookmarkRouter aggregates LocalBookmarkService + FileBookmarkService + SyncBookmarkService + BrowserBookmarkService, each item tagged with storage local|file|sync|browser). Fallback: getLocalBookmarksForIndex uses LocalBookmarkService only."
  category: "Functional"
  cross-references: "ARCH-LOCAL_BOOKMARKS_INDEX, IMPL-LOCAL_BOOKMARKS_INDEX, ARCH-STORAGE_INDEX_AND_ROUTER"
  detail_file: "requirements/REQ-LOCAL_BOOKMARKS_INDEX.yaml"
  entry_point: "Popup, extension command open-bookmarks-index, and context menu hoverboard-open-bookmarks-index open the index via SW OPEN_BOOKMARKS_INDEX / OPEN_BOOKMARKS_INDEX_TAB (tabs.create then REQUEST_SIDE_PANEL_CLOSE so an already-open side panel is dismissed). Options page may still link via href (no dismiss). Toolbar icon may reopen the side panel after the index is open [REQ-ICON_CLICK_BEHAVIOR]."
  how_validated:
    - "Composition: runBulkDelete pending/final + preferredBackend sendMessage (bookmarks-table-bulk-delete-composition.integration.test.js); MessageHandler→Router→File preferredBackend delete (message-handler-router-storage.integration.test.js)."
    - "Manual: **Sticky Table Display**: When user scrolls past the Table Display section, the Table Display block and table column headers remain at the top of the viewport; table body scrolls underneath. Content above Table Display scrolls away normally. Actions for selected and row count scroll up with the table content."
    - "Manual: Open index page; Stores – no bookmarks until at least one store (Local/File/Sync) checked; Show only (tags include, to-read, private, time range); Hide (tags exclude); confirm filtered list and sort; click URL to open in new tab (external-link indicator)."
    - "Manual: Select column and select-all; Move selected to (Local | File | Sync); Delete selected – confirmation shows count and names when ≤8; after confirm, #delete-result shows Deleting… then Deleted N…; bookmarks removed and table refreshed."
    - "Manual: Show only **Clear** button resets Tags, To read only, Private only, Time range, and Time field to defaults; Table Display group contains Time column and Time format; layout is compact (reduced whitespace)."
    - "Manual: Time column toggle (Create time | Last updated) and Time format (Absolute | Age); single Time column shows chosen value and format; sort by Time uses selected time source."
    - "Unit tests (bookmarks-table-index.test.js): Bookmark count at bottom – footer-info with row-count as last content in container; footer-spacer before footer-info for short-page layout; CSS has .footer-info position sticky and bottom 0 so count stays visible when scrolling. Manual: with 0 or few bookmarks, count at visual bottom; with many bookmarks, count bar stays at bottom of viewport when scrolling."
    - "Unit tests: handleGetAggregatedBookmarksForIndex returns { bookmarks } with storage field; matchStorageFilter, matchStoresFilter, inTimeRange, matchExcludeTags, buildDeleteConfirmMessage, buildDeletePayload, #delete-result (bookmarks-table-index.test.js); delete-status helpers (bookmarks-table-delete-status.test.js); formatTimeAbsolute and formatTimeAge (bookmarks-table-time.test.js); setTableDisplayStickyHeight (bookmarks-table-index.test.js or bookmarks-table-sticky.test.js)."
    - "Unit tests: isAggregatedIndexLoadFailure, shouldReloadBookmarksOnStoreChange, onStoreFilterChange, createProviderInitMutex (bookmarks-table-load.test.js)."
    - "Unit tests: OPEN_BOOKMARKS_INDEX_TAB create + REQUEST_SIDE_PANEL_CLOSE; popup sends OPEN_BOOKMARKS_INDEX; bookmarks-table.js must not send close (service-worker-open-bookmarks-index.test.js)."
