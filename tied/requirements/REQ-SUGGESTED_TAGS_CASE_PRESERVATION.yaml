REQ-SUGGESTED_TAGS_CASE_PRESERVATION:
  name: Suggested Tags Case Preservation
  category: Functional
  priority: P1
  status: Implemented
  rationale:
    why: Show suggested tags using the best spelling from the page (prefer mixed case over ALL CAPS over all-lowercase for each word). Do not add a second all-lowercase suggestion for the same word; users can switch display casing with the tag case toggle (original / lower / UPPER).
    problems_solved:
      - Lost original case from content
      - Redundant lowercase duplicate chips
    benefits:
      - Canonical spelling from HTML
      - Case toggle controls display without duplicate suggestions
  satisfaction_criteria:
    - criterion: 'One suggested chip per word identity (case-insensitive): canonical spelling prefers mixed case (e.g. Apple) over ALL CAPS over all-lowercase when the page contained those variants.'
    - criterion: No separate all-lowercase duplicate suggestion for a word that also appears with uppercase in content (e.g. not both apple and Apple).
    - criterion: Words that appear only in all-lowercase in content still suggest once in that lowercase form.
    - criterion: With tag case mode upper, the same canonical value displays as ALL CAPS (e.g. Apple → APPLE) via existing chip folding.
  validation_criteria:
    - method: Unit tests
      coverage: pickBetterSuggestedOriginalCase; TagService.extractSuggestedTagsFromContent; tagChipDisplayAndAddValue upper mode (tests/unit/suggested-tag-original-case.test.js)
  traceability:
    architecture:
      - ARCH-SUGGESTED_TAGS
    implementation:
      - IMPL-SUGGESTED_TAGS
    tests:
      - tests/unit/suggested-tag-original-case.test.js
    code_annotations:
      - REQ-SUGGESTED_TAGS_CASE_PRESERVATION
