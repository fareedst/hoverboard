REQ-SIDE_PANEL_POPUP_EQUIVALENT:
  actual: "This Page keeps Current Tags and Recent Tags in their stored/source casing. Suggested Tags render absent, case-match, and case-mismatch state cues; their controls add, remove the exact stored match, or atomically replace the matched tag using the displayed case-converted value. Activating a Suggested Tag preserves the This Page side-panel scroll position across the loading and redraw cycle. The Tag labels control applies only to Suggested Tags; popup/overlay behavior is unchanged."
  category: "Functional"
  detail_file: "requirements/REQ-SIDE_PANEL_POPUP_EQUIVALENT.yaml"
  implementation_approach:
    details:
      - "Tab-change This Page refresh (bindTabChangeRefresh): bookmark path updates for the active tab; non-scriptable / gallery URLs must not attempt content scripting; suggested tags empty on expected skip (unit+composition; no Web Store E2E — platform forbids scripting that target)."
  metadata:
    last_updated:
      author: "AI Agent"
      date: "2026-08-03"
      reason: "Require This Page Suggested Tag actions to preserve side-panel scroll position"
    last_validated:
      date: "2026-08-03"
      result: "pass"
      validator: "focused/full Jest, lint, typecheck, token validation, and tied_validate_consistency"
  name: "Side Panel Popup Equivalent with Tabs"
  priority: "P1"
  rationale:
    benefits:
      - "One panel with tabs \"This Page\" and \"By Tag\"; This Page tab = popup-equivalent UI; By Tag tab = hierarchical view"
      - "User switches between This Page and By Tag inside the same panel"
    problems_solved:
      - "Popup closes when focus is lost; no persistent popup-equivalent view"
      - "Side panel previously showed only the tags tree"
    why: "Users can keep the side panel open and still manage the current tab's bookmark and browse the tags tree without reopening the popup."
  related_requirements:
    depends_on: []
    related_to:
      - "REQ-AI_TAGGING_POPUP"
      - "REQ-SIDE_PANEL_TAGS_TREE"
    supersedes: []
  satisfaction_criteria:
    - "Activating any This Page Suggested Tag preserves the prior #bookmarkPanel scrollTop after loading, focus, persistence, and chip redraw complete."
    - "Current Tags chips always show stored/source casing; remove still targets the stored tag string."
    - "Popup and overlay Suggested Tags continue their existing filtering and add flow."
    - "Suggested Tag activation routes absent to add, case-match to exact stored-tag removal, and case-mismatch to atomic replacement."
    - "Suggested Tags in This Page render all three membership states with accessible text/border cues in addition to distinct backgrounds."
    - "The Tag labels control remains immediately before the Suggested Tags block and affects only Suggested Tags labels/action values."
  status: "Implemented"
  test_scope: "Unit: scoped UIManager rendering, state metadata, keyboard activation, loading scroll restoration, and side-panel markup order; integration: add/remove/replace bindings, authoritative reread, persistence and failure behavior; Playwright: real This Page Suggested Tag activation preserves #bookmarkPanel scrollTop; popup regressions retained."
  traceability:
    architecture:
      - "ARCH-SIDE_PANEL_TABS"
      - "ARCH-SUGGESTED_TAGS"
      - "ARCH-THIS_PAGE_TAG_SORT"
    code_annotations:
