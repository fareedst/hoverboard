    implementation:
      - "IMPL-SIDE_PANEL_BOOKMARK"
      - "IMPL-SIDE_PANEL_TABS"
      - "IMPL-SUGGESTED_TAGS"
      - "IMPL-THIS_PAGE_TAG_SORT"
      - "IMPL-UIManager_SCOPED_ROOT"
    tests:
      - "tests/integration/side-panel-tab-change-injection.integration.test.js"
      - "tests/integration/suggested-tag-chip-composition.integration.test.js"
      - "tests/integration/this-page-tag-sort-composition.integration.test.js"
      - "tests/playwright/extension-this-page-tag-sort.spec.js"
      - "tests/unit/popup-suggested-tags.test.js"
      - "tests/unit/side-panel-html.test.js"
      - "tests/unit/uIManager-tag-case-folding.test.js"
  validation_criteria:
    - method: "Manual verification"
      coverage: "Open panel; scroll This Page; activate absent, case-match, and case-mismatch Suggested Tags; verify the prior panel position remains usable after each action; switch to By Tag and back; close and reopen panel."
    - method: "Unit tests"
      coverage: "UIManager with scoped root (container) resolves elements from that root; loading transition restores container scrollTop; tab switching, persistence, tag-case-folding, and chip add/remove behavior remain covered."
    - method: "Composition tests"
      coverage: "Suggested Tag add, exact-match removal, and case-mismatch replacement bindings remain covered without invoking the UI."
