    - criterion: "1. **Suggested tags section below recent tags**: Both popup and overlay display a \"Suggested:\" section positioned below the recent tags section."
    - criterion: "2. **Extracts from title, URL, headings, nav, breadcrumbs, images, links, meta tags, emphasis elements, and structured content**: The extraction algorithm must gather text from:"
    - criterion: "3. **Prioritizes title attribute over textContent**: When extracting element text, prefer the `title` attribute (on the element or child elements) over `textContent`."
    - criterion: "4. **Filters noise, counts frequency, sorts by frequency**: Remove common English stop words, count word occurrences, and return suggestions sorted by frequency (descending), then alphabetically."
    - criterion: "5. **Restricted-URL skip (popup path)**: When the current tab URL is not injectable (e.g. `chrome-extension://`, `chrome://`, `file://`), the popup must not attempt script injection; it must show no suggested tags and must not surface a runtime error (e.g. \"Cannot access contents of url\"). Only `http://` and `https://` URLs are considered injectable for suggested-tag extraction."
