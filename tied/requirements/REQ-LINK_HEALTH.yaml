REQ-LINK_HEALTH:
  category: "Functional"
  description: "Users can run batch link health checks on Index-selected or displayed bookmarks. The extension performs direct HTTP HEAD (fallback GET) from the service worker, stores last status and checked_at in chrome.storage.local, and surfaces results on the Index. Inhibit-list and privacy: no third-party uptime SaaS."
  metadata:
    last_updated:
      author: "AI Agent"
      date: "2026-08-02"
      reason: "Enable absent-setting default while preserving explicit opt-out and manual checks"
  name: "Link Health Monitoring"
  priority: "P2"
  rationale:
    benefits:
      - "Local, private health checks"
    problems_solved:
      - "No way to find dead bookmarks"
    why: "Self-hosted bookmark managers differentiate with broken-link detection; Hoverboard can do this without leaving the browser."
  related_requirements:
    depends_on:
      - "REQ-LOCAL_BOOKMARKS_INDEX"
    related_to:
      - "REQ-PRIVACY_CONTROLS"
    supersedes: []
  satisfaction_criteria:
    - criterion: "CHECK_LINK_HEALTH message checks URLs via fetch HEAD then GET"
    - criterion: "Each HEAD/GET uses AbortController with bounded timeout; abort records unreachable/timeout; GET does not buffer body"
    - criterion: "Enabling the setting does not automatically dispatch CHECK_LINK_HEALTH; checks remain user-triggered"
    - criterion: "Index shows Health column and optional status filter"
    - criterion: "Results persisted under hoverboard_link_health"
    - criterion: "Unit tests for classify/filter helpers"
    - criterion: "URLs matching hoverboard_inhibit_urls are skipped (no fetch); recorded as unreachable with error inhibited"
    - criterion: "When enabled, This Page/popup shows compact health hint for current URL from stored map (GET_LINK_HEALTH); no SaaS"
    - criterion: "When linkHealthChecksEnabled is absent, the effective setting is enabled; an explicitly stored false remains disabled; Options can persist either choice"
  status: "Implemented"
  traceability:
    architecture:
      - "ARCH-LINK_HEALTH"
    code_annotations:
      - "REQ-LINK_HEALTH"
    implementation:
      - "IMPL-LINK_HEALTH"
    tests:
      - "tests/integration/bookmarks-table-link-health-composition.integration.test.js"
      - "tests/integration/link-health.integration.test.js"
      - "tests/unit/link-health-sw.test.js"
      - "tests/unit/link-health.test.js"
