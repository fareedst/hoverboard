REQ-BROWSER_BOOKMARK_IMPORT:
  category: "Functional"
  cross-references: "ARCH-BROWSER_BOOKMARK_IMPORT, IMPL-BROWSER_BOOKMARK_IMPORT, REQ-LOCAL_BOOKMARKS_INDEX, REQ-LOCAL_BOOKMARKS_INDEX_IMPORT"
  detail_file: "requirements/REQ-BROWSER_BOOKMARK_IMPORT.yaml"
  metadata:
    created:
      author: "AI Agent"
      date: "2026-02-18"
    last_updated:
      author: "AI Agent"
      date: "2026-08-03"
      reason: "Align Index-owned Browser import surface and validation evidence"
    last_validated:
      date: "2026-02-18"
      result: "pass"
      validator: "AI Agent"
  name: "Browser Bookmark Import Page"
  priority: "P1"
  rationale:
    benefits:
      - "Dedicated page loads native bookmarks via chrome.bookmarks.getTree; user filters by folder and search, selects rows, chooses conflict mode (Skip | Overwrite | Merge), assigns tags from folder names and optional extra tags, imports to Local | File | Sync via existing saveBookmark"
      - "Intentional exclusion of Browser as import target avoids circular copy from chrome.bookmarks into the browser backend"
    problems_solved:
      - "No way to filter/select which browser bookmarks to import or resolve URL conflicts"
      - "No way to import browser bookmarks into Hoverboard"
    why: "Let users copy selected records from the live browser bookmark tree into Hoverboard-owned Local, File, or Sync storage from the Local Bookmarks Index. The Browser storage backend remains the source, not an import target; the former standalone URL is a compatibility entry point to the Index workflow."
  related_requirements:
    depends_on: []
    related_to:
      - "REQ-BROWSER_BOOKMARK_STORAGE"
      - "REQ-LOCAL_BOOKMARKS_INDEX"
      - "REQ-LOCAL_BOOKMARKS_INDEX_IMPORT"
    supersedes: []
  satisfaction_criteria:
    - "Browser-tree import uses target-specific conflict detection against the selected Local, File, or Sync backend; Browser source rows do not conflict with themselves."
    - "Browser-tree records are collapsed by cleaned URL before import, folder-derived tags strip Chrome root segments, and optional extra tags are sanitized and deduplicated."
    - "Legacy Browser Bookmark Import entry points open the Local Bookmarks Index with the Browser source selected; no separate import surface is required."
    - "The Local Bookmarks Index Import control can select the live browser bookmark tree as a source and displays selectable records with title, URL, folder path, and date added; search and folder filtering are available."
    - "User can select Skip, Overwrite, or Merge tags, choose Local, File, or Sync as the target, import through saveBookmark, and receive imported, skipped, and failed counts."
  status: "Implemented"
  summary: "Live Browser-tree import is integrated into the Local Bookmarks Index. It preserves selective folder/search import, folder-to-tag mapping, extra tags, target-specific Skip/Overwrite/Merge conflict handling, and Local|File|Sync targets; the former standalone URL redirects to the Index."
  traceability:
    architecture:
      - "ARCH-BROWSER_BOOKMARK_IMPORT"
    code_annotations:
      - "REQ-BROWSER_BOOKMARK_IMPORT"
    implementation:
      - "IMPL-BROWSER_BOOKMARK_IMPORT"
    tests:
      - "tests/integration/tools-toolbar-launchers-composition.integration.test.js"
      - "tests/playwright/extension-bookmarks-index-controls.spec.js"
      - "tests/playwright/extension-lower.spec.js"
      - "tests/unit/bookmarks-table-browser-import.test.js"
  validation_criteria:
    - method: "Manual verification"
      coverage: "Open the Index from legacy, popup, options, command, context-menu, toolbar, or keyboard entry; confirm ?source=browser selects Import; load the live Browser tree; search and folder-filter rows; select records; run Skip, Overwrite, and Merge tags into Local, File, or Sync; confirm imported, skipped, and failed counts and refreshed Index."
    - method: "Unit tests"
      coverage: "tests/unit/bookmarks-table-browser-import.test.js — duplicate cleaned-URL collapse, folder-path list/filter, root-stripped folder tags, sanitized extra tags, target-scoped conflict lookup, and Merge metadata preservation."
