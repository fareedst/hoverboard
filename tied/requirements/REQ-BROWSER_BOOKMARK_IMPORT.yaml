REQ-BROWSER_BOOKMARK_IMPORT:
  category: "Functional"
  cross-references: "ARCH-BROWSER_BOOKMARK_IMPORT, IMPL-BROWSER_BOOKMARK_IMPORT, REQ-LOCAL_BOOKMARKS_INDEX, REQ-LOCAL_BOOKMARKS_INDEX_IMPORT"
  detail_file: "requirements/REQ-BROWSER_BOOKMARK_IMPORT.yaml"
  metadata:
    created:
      author: "AI Agent"
      date: "2026-02-18"
    last_updated:
      author: "AI Agent"
      date: "2026-07-29"
      reason: "Corpus remediation Phase 1+6: document Browser import-target exclusion and panel vs Store B boundary"
    last_validated:
      date: "2026-02-18"
      result: "pass"
      validator: "AI Agent"
  name: "Browser Bookmark Import Page"
  priority: "P1"
  rationale:
    benefits:
      - "Dedicated page loads native bookmarks via chrome.bookmarks.getTree; user filters by folder and search, selects rows, chooses conflict mode (Skip | Overwrite | Merge), assigns tags from folder names and optional extra tags, imports to Local | File | Sync via existing saveBookmark"
      - "Intentional exclusion of Browser as import target avoids circular copy from chrome.bookmarks into the browser backend"
    problems_solved:
      - "No way to filter/select which browser bookmarks to import or resolve URL conflicts"
      - "No way to import browser bookmarks into Hoverboard"
    why: "Let users copy bookmarks from the browser's native bookmarking API into Hoverboard storage (Local | File | Sync) with filter, selection, conflict resolution, and tag assignment. Browser is not an Import-to target because the page's source is the Chrome tree itself."
  related_requirements:
    depends_on: []
    related_to:
      - "REQ-BROWSER_BOOKMARK_STORAGE"
      - "REQ-LOCAL_BOOKMARKS_INDEX"
      - "REQ-LOCAL_BOOKMARKS_INDEX_IMPORT"
    supersedes: []
  satisfaction_criteria:
    - criterion: "Dedicated extension page displays browser bookmarks (flattened from getTree) with Select column, Title, URL, Folder path, Date added; search over title/URL; filter by folder."
    - criterion: "Documented boundary: Browser Bookmark Import copies FROM the Chrome tree INTO Hoverboard backends; REQ-BROWSER_BOOKMARK_STORAGE is the BookmarkRouter peer backend (Store B), not an import destination on this page."
    - criterion: "Import uses existing getAggregatedBookmarksForIndex (or getLocalBookmarksForIndex) for conflict set and saveBookmark for each selected item; no new backend message for reading bookmarks (chrome.bookmarks called from page)."
    - criterion: "User can select bookmarks (checkboxes, select-all), choose conflict mode (Skip / Overwrite / Merge) when URL exists in Hoverboard, optionally use folder names as tags and add extra tags, choose Import to (Local | File | Sync only — Browser excluded as target), and run import; result shows imported, skipped, failed counts."
  status: "Implemented"
  summary: "A dedicated **Browser Bookmark Import** page loads native bookmarks (chrome.bookmarks.getTree), lets users filter (search, folder), select rows, resolve conflicts (Skip | Overwrite | Merge), assign tags (folder names + extra), and import to Local | File | Sync via saveBookmark; entry from popup and Options. **Import to Browser is intentionally excluded**: the source is already the Chrome bookmark tree; copying into backend `browser` would be circular. Use Local Bookmarks Index Import or Save to / Move when writing into Browser storage (backend). Distinct from REQ-BROWSER_BOOKMARK_STORAGE (peer backend / Store B)."
  traceability:
    architecture:
      - "ARCH-BROWSER_BOOKMARK_IMPORT"
    code_annotations:
      - "REQ-BROWSER_BOOKMARK_IMPORT"
    implementation:
      - "IMPL-BROWSER_BOOKMARK_IMPORT"
    tests:
      - "tests/unit/browser-bookmark-import.test.js"
  validation_criteria:
    - method: "Manual verification"
      coverage: "Open page from popup/options; load browser bookmarks; search, folder filter, sort, select; run import with each conflict mode and tag options; confirm result message and data in Hoverboard index."
    - method: "Unit tests"
      coverage: "tests/unit/browser-bookmark-import.test.js — sanitizeTag, folderPathToTags, parseExtraTags, flattenTree; conflict logic (skip, overwrite, merge)."
