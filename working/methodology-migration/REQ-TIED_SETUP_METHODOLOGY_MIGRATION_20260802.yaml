    goals: "Map pseudo-code to a failing test."
    outcomes: "Test exists matching pseudo-code and REQ; honest RED or brownfield baseline documented; production source unchanged except Pattern B minimal shim when declared."
    preconditions:
      - "Automated test harness exists and is runnable (e.g. go test, npm test, pytest, cargo test, xcodebuild test, bash tests/*.sh). If absent, establish a minimal harness in this step (including a bash-based runner) or document harness gap / e2e_only per tasks and IMPL detail."
