      - "Follow the structure/format/content/governance standards in tied/docs/vocabulary-index-analysis-and-standards.md (preferred-term tables, naming bridges, define-once-link-many, vocabulary-not-algorithm, alphabetical index)."
      - "IF vocab files are absent and the change does not yet warrant seeding an index: pick internally consistent terms for this pass and note the deferral; do not block the caller (except VALIDATE must not fake pass—use explicit deferral note)."
      - "PRELOAD mode (Touchpoint 2 — before reading TIED indexes, detail files, source, or tests): read ./tied/vocab/routing.md; match task keywords to the routing table; from caller scope (change-definition, sponsor context, affected modules) list concepts/subsystems in play; open only matched ./tied/vocab/<topic>.md files; extract preferred terms, avoid-list synonyms, naming-bridge rows, and UPPER_SNAKE block names; produce a brief term map in step output or the per-request checklist copy for use when reading subsequent artifacts; for cross-cutting concerns search ./tied/vocab/domain-references.md on demand."
      - "RECORD mode (inline during work — as concepts are generated, and after artifacts are written): add or update the term immediately—preferred-term-vs-synonym row, naming bridge row (concept <-> token <-> storage name <-> UI label), and UPPER_SNAKE block name—keep the alphabetical index in sync, and cite the relevant REQ/ARCH/IMPL."
      - "RESOLVE mode (Touchpoint 1 and inline before naming/writing): look up the concept in ./tied/vocab/*.md; choose the one preferred term; reword fuzzy/synonym wording to that canonical term; verify exact spelling/backtick form; flag any term absent from the index (route to RECORD)."
      - "VALIDATE mode (Touchpoint 3 — before commit): enumerate named concepts introduced or changed this pass across ./tied/vocab/*.md, REQ/ARCH/IMPL index name fields, semantic-tokens.yaml, essence_pseudocode block names, code_locations, tests, production code symbols, and README/CHANGELOG; for each concept confirm exactly one preferred term in the index, no synonym-only usage, naming bridge matches token/storage/UI forms, alphabetical index covers every canonical term used, and REQ/ARCH/IMPL cited on new rows; emit a validation report (pass or failures with file/artifact reference); IF failures RETURN to caller with fix list—caller must RECORD or RESOLVE before re-VALIDATE."
    title: "Resolve, preload, record, and validate domain vocabulary index terms"
    tracking:
      consideration_before_proceeding: "Caller mode satisfied (RESOLVE/PRELOAD/RECORD/VALIDATE); immature-client deferral noted when tied/vocab is absent; RETURN to caller."
      retry_count: "0"
      state_history: []
      status: "pending"
version: "1.7.0"
vocabulary_touchpoints:
  - id: "prompt-intake"
    mode: "RESOLVE"
    steps:
      - "change-definition"
      - "translate-sponsor-intent"
    when: "Sponsor or user text names concepts before formal TIED work"
  - id: "pre-read"
    mode: "PRELOAD"
    steps:
      - "impact-discovery"
      - "session-bootstrap"
    when: "Before reading TIED indexes, detail files, source, or tests"
  - id: "pre-commit"
    mode: "VALIDATE"
    steps:
      - "traceable-commit"
      # Paths below are repo-relative from the workspace root where this checklist runs.
    when: "Before staging and commit"
workspace_paths:
  # WORKSPACE_ROOT: set when copies live outside the default checkout
  CITDP_RECORDS: "./tied/citdp"
  # VOCAB_INDEX: domain vocabulary index files (*.md, no -vocabulary suffix); standards in tied/docs/vocabulary-index-analysis-and-standards.md
  TIED_BASE: "./tied"
  TIED_DOCS: "./tied/docs"
  VOCAB_INDEX: "./tied/vocab"
