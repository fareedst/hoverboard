      - "IF the focused RED test now passes but other existing tests fail, STOP production-code iteration and emit a final fenced JSON control block: {\"agentstream_control\":{\"schema_version\":1,\"action\":\"goto\",\"target\":\"flag-contradictory-specs\",\"reason\":\"Focused RED test passes, but existing tests fail after GREEN code; re-check related IMPL pseudo-code for contradictory specs before more code changes.\",\"evidence\":[\"<test command and failing existing test names or concise summary>\"]}}. Do not infer this from prose; the fenced JSON block is the machine-readable agentstream routing signal."
      - "Refer to vocab before writing code: CALL sub-vocabulary-sync (RESOLVE) so new symbols, identifiers, and any file/folder/schema names introduced by the code use the preferred domain terms in ./tied/vocab/*.md and match the IMPL block name; CALL sub-vocabulary-sync (RECORD) for any new code-level term/storage name ([PROC-VOCABULARY_INDEX])."
      - "Responsibility: test/code owner step. Implement only logic already defined in pseudocode for this block."
      - "Run language-specific lint (Rust/TypeScript/Swift/YAML per project). IF lint fails THEN fix before proceeding."
      - "Run tests. IF tests fail THEN iterate on production code only (do not add new tests in GREEN)."
      - "Write only enough production code to make the failing test pass."
    title: "Minimal code to pass (Phase E)"
    tracking:
      consideration_before_proceeding: "Test passes; lint clean; new code symbols/storage names resolved from and recorded in the canonical vocabulary; block lead in production matches IMPL and test; token comments match pseudo-code block."
