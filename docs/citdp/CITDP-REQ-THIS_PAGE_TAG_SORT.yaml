change_definition:
  summary: 'Add a shared sort mode for Current Tags, Recent Tags, and Suggested Tags chip rows on the side panel This Page tab only: alphabetical (case-insensitive display), bookmark usage frequency from hoverboard_tag_frequency, and DOM relevance from MAIN-world suggested-tags flow. Popup unchanged when sort UI absent; no cross-session persistence.'
  refinements_post_s02:
    - 'PopupController._normalizeSuggestedRowsFromMainWorld implements NORMALIZE_SUGGESTED_ROWS + FILTER_INVALID_ROWS: trim tag strings; drop empty or whitespace-only labels before FILTER_NOT_ON_CURRENT_BOOKMARK ([IMPL-THIS_PAGE_TAG_SORT], [IMPL-SUGGESTED_TAGS], [REQ-SUGGESTED_TAGS_FROM_CONTENT]).'
    - loadInitialData awaits loadRecentTags before loadSuggestedTags so Recent chips are ready when suggestions refresh (popup and side panel).
  scope_in:
    - src/shared/tag-chip-sort.js
    - src/ui/popup/UIManager.js
    - src/ui/popup/PopupController.js
    - src/features/tagging/suggested-tags-main-world-snippet.js
