risk_analysis:
  # [PROC-AGENT_REQ_CHECKLIST] S07 — severity / likelihood scales: low | medium | high
  risks:
    - id: R1
      description: Invalid or unexpected hoverboard_tag_frequency storage shape breaks frequency sort or mis-ranks chips
      severity: medium
      likelihood: low
      tied_token_references:
        - REQ-THIS_PAGE_TAG_SORT
        - ARCH-THIS_PAGE_TAG_SORT
        - IMPL-THIS_PAGE_TAG_SORT
      mitigation: PopupController._normalizeHoverboardTagFrequencyMap coerces payloads to a plain string-to-number map or {}; refresh path logs errors without throwing; unit tests in popup-refresh-tag-frequency-map.test.js lock coercion behavior
      residual: low
    - id: R2
      description: MAIN-world two-step inject (snippet file then extractor func) fails or returns empty — suggested tags missing while page is otherwise valid
      severity: medium
      likelihood: medium
      tied_token_references:
        - REQ-SUGGESTED_TAGS_FROM_CONTENT
        - ARCH-SUGGESTED_TAGS
        - IMPL-SUGGESTED_TAGS
        - IMPL-THIS_PAGE_TAG_SORT
      mitigation: File inject failure is non-fatal (log + continue); func inject wrapped in try/catch; non-http(s) tabs short-circuit to empty list; ordering and empty-on-error documented in IMPL essence_pseudocode; popup-suggested-tags unit tests cover skip paths and injectable URLs
      residual: low
    - id: R3
      description: Side panel vs standalone popup behavioral drift (sort UI, scoped DOM, suggested pipeline)
      severity: medium
      likelihood: low
      tied_token_references:
        - REQ-SIDE_PANEL_POPUP_EQUIVALENT
        - IMPL-UIManager_SCOPED_ROOT
        - IMPL-SIDE_PANEL_BOOKMARK
        - IMPL-THIS_PAGE_TAG_SORT
      mitigation: Shared PopupController/UIManager code paths; sort applies only when tagSortToggle resolves (panel); popup remains unchanged when toggle absent; ui-manager-scoped-root and composition tests exercise container + data-popup-ref
      residual: low
    - id: R4
      description: Overlay TagService.sanitizeTag vs MAIN-world inline sanitizer diverge on edge characters — user-visible suggestion string differs by surface
      severity: low
      likelihood: low
      tied_token_references:
        - ARCH-SUGGESTED_TAGS
        - IMPL-SUGGESTED_TAGS
        - IMPL-TAG_SYSTEM
        - REQ-TAG_INPUT_SANITIZATION
      mitigation: Documented cross-path note in IMPL-SUGGESTED_TAGS essence_pseudocode; tokenizer must stay identical; tag sanitization covered by IMPL-TAG_SYSTEM unit tests; prefer future alignment or shared primitive if drift is observed in the field
      residual: low
    - id: R5
      description: Tokenizer / delimiter regex drifts between TagService and suggested-tags-main-world-snippet — inconsistent suggestions between overlay and popup for the same page
      severity: high
      likelihood: low
      tied_token_references:
        - ARCH-SUGGESTED_TAGS
        - IMPL-SUGGESTED_TAGS
      mitigation: ARCH-SUGGESTED_TAGS requires tokenizer sync; code review + tests for extractSuggestedTagsFromContent and snippet path (e.g. suggested-tag-original-case.test.js, popup-suggested-tags.test.js); LEAP update if either side changes delimiter rules
      residual: low
    - id: R6
      description: Bookmark panel subtree missing data-popup-ref keys or wrong container passed to UIManager — null elements, broken This Page controls (including sort toggle discovery)
      severity: high
      likelihood: low
      tied_token_references:
        - REQ-SIDE_PANEL_POPUP_EQUIVALENT
        - ARCH-SIDE_PANEL_TABS
        - IMPL-UIManager_SCOPED_ROOT
        - IMPL-SIDE_PANEL_BOOKMARK
      mitigation: side-panel.html mirrors popup ref keys; cacheElements tolerates nulls where callers allow; ui-manager-scoped-root.test.js asserts querySelector vs getElementById branching; integration/e2e catch gross regressions
      residual: low
    - id: R7
      description: Canonical case ranking (pickBetterSuggestedOriginalCase) or tag-case toggle interaction regresses — duplicate chips, wrong stored casing on add-from-chip, or wrong display order
      severity: medium
      likelihood: low
      tied_token_references:
        - REQ-SUGGESTED_TAGS_CASE_PRESERVATION
        - REQ-SUGGESTED_TAGS_FROM_CONTENT
        - ARCH-SUGGESTED_TAGS
        - IMPL-SUGGESTED_TAGS
        - IMPL-THIS_PAGE_TAG_SORT
      mitigation: REQ-SUGGESTED_TAGS_CASE_PRESERVATION + IMPL pseudo-code define single canonical row per key; tests/unit/suggested-tag-original-case.test.js and uIManager-tag-case-folding.test.js; sort uses displayKey from tagChipDisplayAndAddValue consistent with toggle mode
      residual: low
test_strategy:
  # [PROC-AGENT_REQ_CHECKLIST] S08 — [PROC-TEST_STRATEGY] [PROC-CITDP] step 5; [REQ-MODULE_VALIDATION]
  classification:
    unit:
      - tag-chip-sort comparators and tie-breaks
      - UIManager sort paths with toggle shim
      - PopupController suggested inject and frequency refresh normalization
      - UIManager scoped root cacheElements / updateSectionLabelsVisibility
      - TagService extractSuggestedTagsFromContent and shared suggested-tag-original-case picker
    integration_composition:
      - loadInitialData ordering refreshTagFrequencyMapForSort before updateCurrentTags; loadRecentTags before loadSuggestedTags
      - setupEventListeners data-sort-mode to setTagSortMode
      - PopupController + UIManager wiring for sort mode and suggested rows (JSDOM); normalized rows reach updateSuggestedTags
    e2e_only:
      surface: Real chrome-extension:// side panel document with bundled side-panel.js/css
      reason: Chromium MV3 chrome-extension:// side panel page loads the production side-panel bundle in the extension origin; JSDOM composition tests cannot load unpacked extension HTML, reproduce the Chromium side-panel host (layout, hit targets, focus), or exercise chrome.runtime in that document. Same text as IMPL-THIS_PAGE_TAG_SORT.phase_h_e2e_only_surface.e2e_only_reason.
      spec: tests/playwright/extension-this-page-tag-sort.spec.js
      impl_detail_ref: IMPL-THIS_PAGE_TAG_SORT.phase_h_e2e_only_surface
