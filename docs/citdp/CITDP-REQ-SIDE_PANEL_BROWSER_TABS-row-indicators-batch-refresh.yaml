change_definition:
  summary: Tabs list shows bookmark to-read and private (shared no) indicators per row; after batch Add tags, Set to-read, or Clear to-read, refreshBookmarkDisplayForAllTabs re-merges bookmark state into displayed rows without requiring Refresh. Displayed set for render, copy, close, and batch actions is unified via getDisplayedTabs(); mergeBookmarkReplyIntoTab maps SW/bookmark replies onto rows.
  scope_in:
    - src/ui/side-panel/browser-tabs-panel.js
    - src/ui/side-panel/side-panel.js
    - src/core/message-handler.js
    - src/core/service-worker.js
    - tests/unit/browser-tabs-panel.test.js
    - tests/unit/side-panel-tabs.test.js
    - tests/unit/service-worker-messaging-routing.test.js
    - tests/integration/browser-tabs-tab-composition.integration.test.js
    - tests/playwright/extension-demo-tabs.spec.js
    - tied/requirements/REQ-SIDE_PANEL_BROWSER_TABS.yaml
    - tied/architecture-decisions/ARCH-SIDE_PANEL_BROWSER_TABS.yaml
    - tied/implementation-decisions/IMPL-SIDE_PANEL_BROWSER_TABS.yaml
    - tied/implementation-decisions/IMPL-SIDE_PANEL_TABS.yaml
  scope_out:
    - Popup bookmark row display (separate IMPL path)
    - Pinboard API semantics beyond existing bookmark model
impact_analysis:
  affected_modules:
    - name: browser-tabs-panel
      role: Row indicators; getDisplayedTabs; batch bookmark handlers; mergeBookmarkReplyIntoTab; refreshBookmarkDisplayForAllTabs
    - name: side-panel
      role: Composition with IMPL-SIDE_PANEL_TABS; messaging to SW for bookmark operations
  tied_stack:
    - REQ-SIDE_PANEL_BROWSER_TABS
    - ARCH-SIDE_PANEL_BROWSER_TABS
    - IMPL-SIDE_PANEL_BROWSER_TABS
    - IMPL-SIDE_PANEL_TABS
risk_analysis:
  risks:
    - id: R1
      description: Batch bookmark refresh omits tabs or leaves stale tags or to-read/private flags if mergeBookmarkReplyIntoTab keys mismatch tab ids or replies arrive out of order
      severity: high
      likelihood: low
      tied_token_references:
        - REQ-SIDE_PANEL_BROWSER_TABS
        - IMPL-SIDE_PANEL_BROWSER_TABS
        - ARCH-SIDE_PANEL_BROWSER_TABS
      mitigation: Merge by stable tab id from displayed list; await per-tab bookmark flows as defined in IMPL pseudo-code; unit tests for mergeBookmarkReplyIntoTab and refreshBookmarkDisplayForAllTabs after simulated batch replies
      residual: low
    - id: R2
      description: getDisplayedTabs diverges from what the user sees (filter vs hidden-row state) so batch actions affect a different set than expected
      severity: high
      likelihood: low
      tied_token_references:
        - REQ-SIDE_PANEL_BROWSER_TABS
        - IMPL-SIDE_PANEL_BROWSER_TABS
      mitigation: Single source of truth for displayed rows across render, copy, close, and batch paths; unit tests assert batch uses same list as visible filter and remove-from-display rules
      residual: low
    - id: R3
      description: Cross-IMPL inconsistency between popup URL tag display and Tabs row tags or flags after refresh
      severity: medium
      likelihood: low
      tied_token_references:
        - IMPL-SIDE_PANEL_BROWSER_TABS
        - IMPL-URL_TAGS_DISPLAY
        - REQ-SIDE_PANEL_BROWSER_TABS
      mitigation: Reuse same bookmark fields (tags, toread, shared) as popup-equivalent sources; document composed_with and see_also in IMPL; regression tests in browser-tabs-panel and Playwright side-panel-browser-tabs
      residual: low
    - id: R4
      description: Service worker or runtime messaging failures during post-batch refresh yield partial UI updates or silent errors
      severity: medium
      likelihood: medium
      tied_token_references:
        - ARCH-SIDE_PANEL_BROWSER_TABS
        - IMPL-SIDE_PANEL_BROWSER_TABS
      mitigation: Follow existing error-handling patterns for chrome.runtime callbacks; keep refresh path idempotent where possible; tests with mocked failed sends or empty responses
      residual: medium
    - id: R5
      description: Performance regression when many tabs are displayed and refresh triggers multiple bookmark lookups
      severity: low
      likelihood: medium
      tied_token_references:
        - REQ-SIDE_PANEL_BROWSER_TABS
        - IMPL-SIDE_PANEL_BROWSER_TABS
      mitigation: Scope refresh to displayed/loaded tabs only per IMPL; avoid redundant full list rebuilds where pseudo-code allows incremental merge
      residual: low
    - id: R6
      description: Private indicator misunderstood (shared flag vs product wording) leading to incorrect trust in UI
      severity: low
      likelihood: low
      tied_token_references:
        - REQ-SIDE_PANEL_BROWSER_TABS
        - IMPL-SIDE_PANEL_BROWSER_TABS
      mitigation: REQ satisfaction criterion locks product rule (private when shared no); tooltips/labels aligned; unit tests for indicator visibility from shared and toread fields
      residual: low
    - id: R7
      description: Batch tag operations aligned with IMPL-LOCAL_BOOKMARKS_INDEX_ADD_TAGS semantics differ from per-tab create/merge in edge cases (e.g. duplicate tags, empty bookmark)
      severity: medium
      likelihood: low
      tied_token_references:
        - IMPL-SIDE_PANEL_BROWSER_TABS
        - IMPL-LOCAL_BOOKMARKS_INDEX_ADD_TAGS
        - REQ-LOCAL_BOOKMARKS_INDEX_ADD_TAGS
      mitigation: parseTagsInput/buildAddTagsPayload parity with batch bookmark IMPL; fetch-then-merge for existing bookmarks per REQ; tests for create vs merge paths
      residual: low
test_strategy:
  classification:
    unit:
      - filterBrowserTabs (pure)
      - mergeBookmarkReplyIntoTab when present in code exports (bookmark projection)
      - buildUrlListForCopy / buildRecordsYamlForCopy (pure over tab rows)
      - parseImportantTagSources / Elements persistence helpers
      - getFaviconSrc / getReferrerDisplayText-style helpers
      - updateStatsLine arithmetic (display vs total counts) when extracted or asserted via DOM text
    integration:
      - loadTabs + merge referrers / pageText / importantTags (mocked chrome.tabs, sendMessage)
      - SW routing GET_TAB_REFERRERS, GET_TABS_PAGE_TEXT, GET_TABS_IMPORTANT_TAGS (mocked chrome.scripting)
      - renderList, listDisplayMode, hiddenTabIds / getDisplayedTabs, batch bookmark, copy/close, Gather/Distribute (JSDOM + mocks)
      - composed_with IMPL-SIDE_PANEL_TABS — tab ids, visibility, lazy init (side-panel-tabs.test.js)
    e2e_only:
      - phase_h_browser_tabs_extension_side_panel — real chrome-extension:// side panel document
      - phase_h_browser_tabs_multi_window_focus — optional OS-level second window focus proof
